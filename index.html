<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>TriPeaks — Adaptive Experience Director</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Lexend',sans-serif;background:#eef0f5;color:#1a1d23;font-size:14px;padding:12px;}

.page{height:100%;background:#fff;border-radius:20px;padding:18px 22px;
  box-shadow:0 8px 40px rgba(59,91,219,0.08);display:flex;flex-direction:column;gap:12px;
  width:100%;max-width:1280px;margin:0 auto;}

.hdr{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
.brand{display:flex;align-items:center;gap:11px;}
.brand-mark{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b5bdb,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;letter-spacing:-0.5px;}
.brand-name{font-size:13px;font-weight:700;}
.brand-sub{font-size:10.5px;color:#6b7280;margin-top:1px;}
.tag{font-size:10.5px;font-weight:600;color:#3b5bdb;background:#eef2ff;padding:6px 14px;border-radius:20px;}
.tag.bad{color:#dc2626;background:#fef2f2;}
.tag.live{color:#b45309;background:#fffbeb;}
.tag.busy{color:#3b5bdb;background:#eef2ff;}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #dbe1f5;border-top-color:#3b5bdb;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:9px;}
@keyframes sp{to{transform:rotate(360deg)}}
.highlights.busybox{background:#f4f6fb;}
.highlights.busybox p::before{background:#c3cbe0;}
button:disabled{opacity:.45;cursor:progress;}

.ctlbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:0 0 auto;}
/* One height for every control in the bar. Equal padding is necessary but not sufficient:
   the Suits pill is a flex box wrapping a 4px-tall range input, so its content box comes
   out shorter than the text line box that sets a button's height. align-items:center on
   the bar means nothing stretches to match, so the height has to be stated. */
.ctlbar select,.ctlbar button,.ctlbar .mixctl,.ctlbar .dd .ddbtn{min-height:33px;}
/* Styled dropdowns. A native option list is drawn by the OS and no CSS reaches it, so a
   select in this bar wears our pill and then opens a grey system menu with square corners.
   The real <select> stays in the DOM as the source of truth and is hidden; this is the part
   the player sees.
   Every rule below is .dd-scoped rather than bare .ddbtn on purpose: the generic
   button:hover:not(:disabled) rule sets the background SHORTHAND, which resets
   background-image to none and would swallow the chevron on hover at a specificity a single
   class cannot beat. */
.ddhide{display:none;}
.dd{position:relative;display:inline-flex;}
.dd .ddbtn{font-family:inherit;font-size:11.5px;font-weight:500;
  padding:8px 34px 8px 14px;border-radius:18px;border:1.5px solid #e8eaed;
  background:#fff;color:#1a1d23;cursor:pointer;text-align:left;white-space:nowrap;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;background-size:9px 6px;}
.dd .ddbtn:hover{background-color:#f8f9fc;}
.dd.open .ddbtn{border-color:#3b5bdb;background-color:#fff;}
.dd .ddbtn:focus-visible{outline:none;border-color:#3b5bdb;}
.ddmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:2000;
  background:#fff;border:1.5px solid #e8eaed;border-radius:14px;padding:5px;
  box-shadow:0 14px 32px rgba(26,29,35,.14),0 2px 6px rgba(26,29,35,.06);
  max-height:300px;overflow-y:auto;}
.ddmenu[hidden]{display:none;}
.ddmenu .ddopt{display:block;width:100%;font-family:inherit;font-size:11.5px;font-weight:500;
  min-height:0;padding:8px 12px;border:0;border-radius:11px;background:transparent;
  color:#1a1d23;cursor:pointer;text-align:left;white-space:nowrap;}
.ddmenu .ddopt:hover{background:#f2f5fb;}
.ddmenu .ddopt.sel{background:#eef2ff;color:#3b5bdb;font-weight:700;}
/* The native select arrow is painted at the far edge of the control and ignores
   padding-right, so on an 18px pill it sits in the curve with nowhere to breathe. Turn the
   native appearance off and draw the chevron as a positioned background instead: inset
   14px, clear of the radius, with room reserved on the right so a long option name cannot
   run underneath it. The shorthand background:#fff has to come BEFORE background-image or
   it resets it. */
select{font-family:inherit;font-size:11.5px;font-weight:500;padding:8px 34px 8px 14px;
  border-radius:18px;border:1.5px solid #e8eaed;background:#fff;color:#1a1d23;cursor:pointer;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;background-size:9px 6px;}
select::-ms-expand{display:none;}
/* appearance:none takes the native focus ring with it, so put one back. */
select:focus-visible{outline:none;border-color:#3b5bdb;}
button{font-family:inherit;font-size:11.5px;font-weight:600;padding:8px 16px;border-radius:18px;
  border:1.5px solid #e8eaed;background:#fff;color:#1a1d23;cursor:pointer;white-space:nowrap;}
button:hover:not(:disabled){background:#f8f9fc;}
button:disabled{opacity:.35;cursor:default;}
/* The colour dial. The track runs red to black through neutral, so the control shows what
   it does before the number is read - dragging left is dragging toward red. */
.mixctl{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:600;
  padding:8px 14px;border-radius:18px;border:1.5px solid #e8eaed;background:#fff;color:#1a1d23;}
.mixctl .mixlab{color:#6b7280;}
.mixctl .mixval{min-width:58px;text-align:right;font-variant-numeric:tabular-nums;}
.mixctl input[type=range]{-webkit-appearance:none;appearance:none;width:94px;height:4px;
  border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#dc2626 0%,#e8eaed 50%,#1a1d23 100%);}
.mixctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #3b5bdb;
  cursor:pointer;}
.mixctl input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:#fff;border:2px solid #3b5bdb;cursor:pointer;}
button.pri{background:#3b5bdb;border-color:#3b5bdb;color:#fff;}
button.pri:hover{background:#2f4ac5;}
button.gold{background:#fffbeb;border-color:#fcd34d;color:#d97706;}
button.mis{border-color:#fecaca;color:#dc2626;}
button.mis:hover{background:#fef2f2;}
.seedtxt{font-size:10.5px;color:#9ca3af;margin-left:auto;font-feature-settings:"tnum";}
.loadmsg{font-size:10.5px;font-weight:600;color:#059669;}
.loadmsg.err{color:#dc2626;}
.linkbtn{font-size:10.5px;font-weight:600;color:#3b5bdb;cursor:pointer;text-decoration:underline;}
.dropzone{position:fixed;inset:10px;background:rgba(59,91,219,.07);border:3px dashed #3b5bdb;
  border-radius:22px;z-index:9999;display:none;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:#3b5bdb;pointer-events:none;}
body.dragging .dropzone{display:flex;}

.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 384px;gap:14px;}
.lcol{min-height:0;display:flex;flex-direction:column;gap:11px;}
.rcol{min-height:0;display:flex;flex-direction:column;gap:11px;overflow:hidden;}
.rscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  gap:11px;padding-right:5px;}
.rscroll::-webkit-scrollbar{width:6px;}
.rscroll::-webkit-scrollbar-track{background:transparent;}
.rscroll::-webkit-scrollbar-thumb{background:#dcdfe6;border-radius:3px;}

.batchbox{background:#fff;border:1.5px solid #e8eaed;border-radius:14px;padding:12px 16px;margin-bottom:10px;flex:0 0 auto;}
.bbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
.bblabel{font-size:12px;font-weight:700;}
.bbtrack{height:6px;background:#eef0f5;border-radius:3px;overflow:hidden;}
.bbfill{height:100%;width:0;background:linear-gradient(90deg,#3b5bdb,#7c3aed);transition:width .2s;}
.bbtxt{font-size:11.5px;color:#6b7280;margin-top:7px;}
.bblist{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:0 0 auto;}
.kpi{background:#fff;border-radius:16px;padding:14px 13px 15px;border:1.5px solid #e8eaed;
  position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:-26px;right:-26px;width:68px;height:68px;border-radius:50%;
  background:var(--c);opacity:0.10;}
/* Sized by its text, not a fixed square: the badges now read CARD, STREAK, EXTRA CARDS -
   words rather than three-letter codes - and the old 27px box clipped them to their first
   characters. Aligned from the left like every other line on the card. */
.kpi-icon{display:inline-flex;align-items:center;justify-content:flex-start;width:auto;
  height:21px;padding:0 9px;border-radius:8px;background:var(--c);font-size:8.5px;color:#fff;
  margin-bottom:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap;}
.kpi-lbl{font-size:10px;color:#6b7280;font-weight:600;margin-bottom:5px;}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1;font-feature-settings:"tnum";}
.kpi-sub{font-size:9.5px;font-weight:600;margin-top:7px;color:var(--c);line-height:1.35;}
/* The one text-valued card in the grid: the target outcome, lifted from the Level plan
   panel so the number the whole round is being steered toward sits beside the numbers
   it is steering. */
.kpi-out{font-size:13.5px;font-weight:800;letter-spacing:-.4px;line-height:1.2;padding-top:4px;}
.kpi-band{font-size:9.5px;font-weight:700;color:#6b7280;margin-top:5px;font-feature-settings:"tnum";}
/* margin-left cancels the pill's own left padding, so the chip's TEXT sits on the same
   left edge as the outcome name and the band above it - the pill background hangs into the
   card padding instead of the text hanging out of the column. */
.kpi-dir{display:inline-flex;align-items:center;margin-top:8px;margin-left:-8px;
  font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:9px;letter-spacing:.2px;}
.kpi-dir.live{background:#fffbeb;color:#b45309;}
.kpi-dir.ver{background:#ecfdf5;color:#059669;}

.sec-hdr{display:flex;align-items:center;gap:9px;flex:0 0 auto;margin-top:2px;}
.sec-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;letter-spacing:-0.3px;}
.sec-title{font-size:14px;font-weight:600;letter-spacing:-0.3px;}

.board-card{flex:0 0 auto;background:#fff;border-radius:18px;
  padding:13px 16px 14px;border:1.5px solid #e8eaed;display:flex;flex-direction:column;}
.board-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  margin-bottom:10px;flex:0 0 auto;}
/* One height across the whole header row. Every pill here was sized by its own font plus
   its own padding, so five different type sizes produced five different heights sitting
   side by side. The meter was worse than uneven: it took its height from its tallest
   child, so the row grew by several pixels the moment the x2 badge appeared and shrank
   again when the streak broke. Its vertical padding is now small enough that the shared
   height governs in both states, which holds the row still mid-game.
   inline-flex so the height is real rather than a side effect of the line box, and the
   padding is left to do only the horizontal. */
.board-head .lvlpill,.board-head .movetag,.board-head .dirtag,
.board-head .meter,.board-head .tg{min-height:30px;}
/* One type size for the whole row as well as one height. Four different sizes - 12.5, 10.5,
   10 and 10 - were doing no work: none of these pills outranks another, they are four
   labels reading left to right. Centred on both axes so a pill that ends up wider than its
   text (the shared min-height can do that) still reads as a label rather than as a box with
   something in the corner. The individual font-size declarations above are removed rather
   than overridden, so there is one place that decides this. */
.lvlpill,.movetag,.dirtag,.tg{display:inline-flex;align-items:center;justify-content:center;
  text-align:center;vertical-align:middle;font-size:11px;}
.lvlpill{display:inline-block;background:#eef2ff;color:#3b5bdb;font-weight:700;
  padding:6px 15px;border-radius:15px;letter-spacing:-.2px;}
.tgw{display:flex;gap:5px;justify-self:end;flex-wrap:nowrap;}
.meter{display:flex;align-items:center;gap:8px;background:#f8f9fc;border:1.5px solid #e8eaed;
  border-radius:22px;padding:3px 13px;flex:0 0 auto;white-space:nowrap;}
.mlbl{font-size:8.5px;font-weight:700;color:#9ca3af;letter-spacing:.7px;}
.pips{display:flex;gap:5px;}
.pip{width:9px;height:9px;border-radius:50%;background:#e2e5eb;transition:background .15s;
  border:1px solid transparent;}
.pip.on{background:#3b5bdb;}
.pip.full{background:#059669;}
/* a pip now carries the colour of the card that filled it */
.pip.red{background:#dc2626;}
.pip.black{background:#1a1d23;}
.pip.wildp{background:#f4c430;border-color:#d9a406;}
.mx2{font-size:10px;font-weight:800;letter-spacing:-.2px;border-radius:9px;
  padding:1px 7px 2px;line-height:1.35;border:1.5px solid transparent;
  animation:x2pop .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.mx2.red{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
.mx2.black{background:#e8eaef;color:#1a1d23;border-color:#c3c8d4;}
@keyframes x2pop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.mrew{font-size:10px;font-weight:700;color:#3b5bdb;font-feature-settings:"tnum";}
@keyframes deckping{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,91,219,.55);}
  35%{transform:scale(1.13);box-shadow:0 0 0 9px rgba(59,91,219,0);}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(59,91,219,0);}
}
.pinged{animation:deckping .62s ease-out 2;}
.rewardfly{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  z-index:1200;pointer-events:none;background:#1a1d23;color:#fff;border-radius:12px;
  padding:9px 16px;font-size:14px;font-weight:800;letter-spacing:-.3px;
  box-shadow:0 10px 30px rgba(26,29,35,.3);animation:rewardpop 1.6s ease-out forwards;}
.rewardfly small{display:block;font-size:9.5px;font-weight:600;opacity:.72;
  letter-spacing:.3px;margin-top:2px;}
@keyframes rewardpop{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.85);}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}
  24%{transform:translate(-50%,-50%) scale(1);}
  74%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-96%) scale(.95);}
}
.mnum{font-size:10.5px;font-weight:700;color:#3b5bdb;font-feature-settings:"tnum";}
.mpay{font-size:9.5px;font-weight:600;color:#059669;padding-left:8px;border-left:1px solid #e2e5eb;}
.tg{font-weight:600;padding:4px 11px;border-radius:13px;border:1.5px solid #e8eaed;
  background:#fff;color:#6b7280;cursor:pointer;user-select:none;}
.tg.on{background:#eef2ff;color:#3b5bdb;border-color:#c7d2fe;}
#boardwrap{flex:0 0 auto;height:420px;position:relative;background:#f8f9fc;border-radius:14px;
  border:1px solid #eef0f5;overflow:hidden;}
.pc{pointer-events:none;position:absolute;border-radius:7px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #d7dae3;background:#fff;font-weight:600;user-select:none;line-height:1;
  transition:opacity .16s,background .12s;}
.pc.dn{border-style:dashed;border-color:#dfe2ea;background:#f3f4f8;}
.pc.pl{background:#eef2ff;border:2px solid #3b5bdb;}
.pc.clk{cursor:pointer;pointer-events:auto;}
.pc.clk:hover{background:#e0e7ff;}
.pc.gh{border-style:dotted;border-color:#d1d5db;background:transparent;opacity:.26;}
.bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:#3b5bdb;
  color:#fff;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.red{color:#dc2626;}
.rk{font-weight:700;letter-spacing:-.4px;}
.sy{font-size:.72em;margin-left:1.5px;position:relative;top:-.5px;}

.tray{display:flex;align-items:flex-end;gap:16px;margin-top:12px;flex-wrap:wrap;flex:0 0 auto;}
.slotl{font-size:9px;color:#9ca3af;font-weight:700;letter-spacing:.5px;margin-bottom:5px;}
.slot{position:relative;width:48px;height:62px;}
.slot.pinged{animation:deckping .62s ease-out 2;}
.stk{position:absolute;width:46px;height:60px;border-radius:7px;border:1.5px solid #e4e7ee;background:#f5f6fa;}
.face{position:absolute;left:0;top:0;width:46px;height:60px;border-radius:7px;border:1.5px solid #d7dae3;
  background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;}
.fnum{font-size:17px;font-weight:800;line-height:1;letter-spacing:-.6px;}
.flbl{font-size:7px;font-weight:700;color:#9ca3af;letter-spacing:.7px;margin-top:3px;}
.face.wrank{font-size:15px;font-weight:700;}
.face.wildf{background:#fffbeb;border-color:#f2ce6a;cursor:pointer;}
.face.wildf:hover{background:#fdf3d3;}
.face.wildf.off{opacity:.4;cursor:default;}
.wl1{font-size:9px;font-weight:800;letter-spacing:.3px;color:#b8790a;line-height:1.22;}
.wused{font-size:8px;font-weight:700;color:#dc2626;margin-top:4px;letter-spacing:.2px;}
.face.wildon{background:#fffbeb;border-color:#f2ce6a;color:#b8790a;font-size:10px;font-weight:800;letter-spacing:.6px;}
.trayacts{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;align-self:stretch;padding-top:12px;}
.tarow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.movetag{display:inline-block;background:#f1f2f5;color:#6b7280;font-weight:700;
  padding:5px 11px;border-radius:13px;margin-left:7px;font-feature-settings:"tnum";vertical-align:middle;}

.beat{background:#f8f9fc;border-radius:16px;padding:12px 16px;border:1.5px solid #e8eaed;flex:0 0 auto;}
.bh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px;}
.pill{font-size:10px;font-weight:700;padding:4px 11px;border-radius:13px;background:#eef2ff;color:#3b5bdb;}
.pill.warn{background:#fffbeb;color:#d97706;}
.pill.dang{background:#fef2f2;color:#dc2626;}
.pill.good{background:#ecfdf5;color:#059669;}
.actx{font-size:11px;color:#6b7280;font-weight:500;}
.needx{font-size:10.5px;color:#9ca3af;margin-left:auto;}
.beat p{font-size:12px;line-height:1.6;}
.hl{font-size:10.5px;color:#9ca3af;margin-top:5px;}
.logrow{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;max-height:66px;
  overflow-y:auto;margin-top:10px;padding-right:4px;}
.logrow::-webkit-scrollbar{width:6px;}
.logrow::-webkit-scrollbar-track{background:transparent;}
.logrow::-webkit-scrollbar-thumb{background:#dcdfe6;border-radius:3px;}
.chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;background:#eceef2;color:#374151;white-space:nowrap;}
.chip.draw{background:#eef2ff;color:#3b5bdb;}
.chip.dead{background:#fffbeb;color:#d97706;}
.chip.miss{background:#fef2f2;color:#dc2626;}
.chip.wild{background:#f5f3ff;color:#7c3aed;}
.chip.lk{background:#fdf2f8;color:#be185d;}

.table-card{background:#fff;border-radius:16px;padding:4px 2px;border:1.5px solid #e8eaed;flex:0 0 auto;}
table{width:100%;border-collapse:collapse;}
td{padding:9px 14px;border-top:1px solid #f3f4f6;font-size:11.5px;}
tr:first-child td{border-top:none;}
td.k{color:#6b7280;width:70px;font-size:10.5px;}
td.v{font-weight:500;}
.day-tag{display:inline-block;background:#eef2ff;color:#3b5bdb;font-weight:700;font-size:10.5px;
  padding:3px 10px;border-radius:11px;line-height:1.45;}
.delta{display:inline-block;padding:2px 9px;border-radius:12px;font-weight:600;font-size:10px;}
.delta-neu{background:#f3f4f6;color:#6b7280;}
.delta-neg{background:#fef2f2;color:#dc2626;}
.delta-pos{background:#ecfdf5;color:#059669;}
.delta-warn{background:#fffbeb;color:#b45309;}
.dnote{font-size:10px;color:#9ca3af;}
.dirtag{display:inline-block;font-weight:700;padding:5px 10px;border-radius:12px;
  margin-left:6px;background:#ecfdf5;color:#059669;letter-spacing:.2px;vertical-align:middle;}
.dirtag.live{background:#fffbeb;color:#b45309;}

.highlights{padding:13px 18px;background:#ecfdf5;border-radius:16px;flex:0 0 auto;}
.highlights p{font-size:11px;line-height:1.65;padding-left:16px;position:relative;}
.highlights p+p{margin-top:6px;}
.highlights p::before{content:'';position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:#059669;}
.highlights b{color:#059669;font-weight:700;}
.highlights.amber{background:#fffbeb;}
.highlights.amber p::before{background:#f59e0b;}
.highlights.amber b{color:#b45309;}
.highlights.red{background:#fef2f2;}
.highlights.red p::before{background:#dc2626;}
.highlights.red b{color:#dc2626;}

.insight-card{background:#fff;border-radius:15px;padding:12px 14px;border:1.5px solid #e8eaed;flex:0 0 auto;}
.ic-title{font-size:11px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
.ic-dot{width:9px;height:9px;border-radius:50%;}
.ic-body{font-size:10.5px;color:#6b7280;line-height:1.6;}
/* ---- extra card experience director ---------------------------------- */
#ecov{position:absolute;inset:0;z-index:900;pointer-events:none;}
#ecov .ecpad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(248,249,252,.86);backdrop-filter:blur(2px);pointer-events:auto;}
.ecoffer{width:min(430px,92%);background:#fff;border:1.5px solid #e8eaed;border-radius:18px;
  padding:16px 18px 14px;box-shadow:0 12px 36px rgba(26,29,35,.13);}
.ecoh{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;}
.ecot{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.ecos{font-size:10.5px;color:#6b7280;margin-left:auto;font-feature-settings:"tnum";}
.ecolead{font-size:11.5px;color:#6b7280;line-height:1.5;margin-bottom:11px;}
.ecbtns{display:flex;gap:8px;}
.ecbtn{flex:1;border:1.5px solid #e8eaed;background:#fff;border-radius:13px;padding:10px 12px 11px;
  cursor:pointer;text-align:left;transition:border-color .12s,background .12s;}
.ecbtn:hover{border-color:#3b5bdb;background:#f8f9fc;}
.ecbtn.coin{border-color:#fcd34d;background:#fffbeb;}
.ecbtn.coin:hover{border-color:#d97706;}
.ecbk{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9ca3af;}
.ecbn{font-size:20px;font-weight:800;letter-spacing:-1px;line-height:1.15;}
.ecbs{font-size:9.5px;color:#6b7280;font-weight:500;}
.ecquit{margin-top:9px;display:flex;align-items:center;gap:9px;}
.ecquit button{font-size:10.5px;padding:6px 13px;}
.ecfine{font-size:9.5px;color:#9ca3af;line-height:1.45;}
.ecdead{font-size:11.5px;color:#b45309;line-height:1.5;}
/* running strip - a slim bar pinned to the bottom of the board box */
.ecbar{position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  background:#eef2ff;border-top:1.5px solid #c7d2fe;padding:6px 11px 7px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ecbar.done{background:#ecfdf5;border-top-color:#a7f3d0;}
.ecbar.short{background:#fff7ed;border-top-color:#fed7aa;}
.ecbl{font-size:11px;font-weight:700;color:#3730a3;letter-spacing:-.2px;}
.ecbar.done .ecbl{color:#047857;}
.ecbar.short .ecbl{color:#b45309;}
.ectag{font-size:8.5px;font-weight:600;color:#6b7280;background:#fff;border:1px solid #e2e5eb;
  border-radius:5px;padding:0 5px;line-height:16px;font-feature-settings:"tnum";}
.ectag.hot{color:#b45309;border-color:#fde68a;background:#fffbeb;}
.ecsteps{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;}
.ecstep{font-size:9.5px;color:#4b5563;background:#fff;border:1px solid #dbe1f5;border-radius:5px;
  padding:0 5px;line-height:17px;font-feature-settings:"tnum";}
.ecstep b{color:#6366f1;font-weight:700;font-size:8px;margin-right:3px;letter-spacing:.3px;}
.ecstep i{color:#9ca3af;font-style:normal;margin-left:3px;}
.ecstep.nil{border-color:#fecaca;color:#b91c1c;}
.ecstep.now{border-color:#818cf8;background:#e0e7ff;font-weight:600;}
.ecstep.pend{color:#c3cbe0;border-style:dashed;}
/* debug card - lives in the right column, which already scrolls */
.ecdbg{background:#fff;border:1.5px solid #e8eaed;border-radius:14px;padding:12px 14px 13px;
  flex:0 0 auto;}
.ecdh{font-size:11.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.ecdk{display:grid;grid-template-columns:auto 1fr;gap:3px 11px;font-size:10.5px;margin-bottom:9px;}
.ecdk b{color:#9ca3af;font-weight:600;}
.eccand{display:flex;align-items:center;gap:7px;font-size:10.5px;padding:2.5px 0;
  border-top:1px solid #f1f3f7;font-feature-settings:"tnum";}
.eccand.pick{font-weight:700;color:#3b5bdb;}
.eccr{width:20px;font-weight:700;}
.eccbar{flex:1;height:5px;background:#eef0f5;border-radius:3px;overflow:hidden;}
.eccbf{height:100%;background:#c7d2fe;}
.eccand.pick .eccbf{background:#3b5bdb;}
.eccq{width:52px;font-size:9px;color:#9ca3af;text-align:right;}
.eccx{width:26px;text-align:right;color:#6b7280;}
.ecwhy{font-size:10px;color:#6b7280;line-height:1.5;margin-top:8px;
  border-top:1px solid #f1f3f7;padding-top:7px;}
.ectune{display:grid;grid-template-columns:46px 1fr 32px;gap:7px 8px;font-size:10px;
  align-items:center;}
.ectune label{color:#6b7280;font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.ectune input[type=range]{width:100%;height:3px;accent-color:#3b5bdb;min-width:0;}
.ectune span{font-feature-settings:"tnum";color:#1a1d23;font-weight:700;text-align:right;}
.ecdial{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;margin-top:3px;}
.ecdial input[type=range]{width:100%;height:5px;accent-color:#3b5bdb;min-width:0;}
.ecdial span{font-size:13px;font-weight:800;color:#3b5bdb;text-align:right;
  font-feature-settings:"tnum";letter-spacing:-.5px;}
/* ---- streak rewards ---------------------------------------------------- */
.stkpanel{background:#fff;border:1.5px solid #e8eaed;border-radius:14px;
  padding:12px 14px 13px;flex:0 0 auto;}
.stkh{font-size:11.5px;font-weight:700;margin-bottom:8px;}
.stkrow{display:grid;grid-template-columns:auto 1fr;gap:3px 11px;font-size:10.5px;
  margin-bottom:9px;}
.stkrow b{color:#9ca3af;font-weight:600;}
.stkcards{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px;}
.stkc{font-size:10px;font-weight:700;border:1px solid #e2e5eb;border-radius:5px;
  padding:1px 5px;background:#fff;font-feature-settings:"tnum";}
.stkc.r{color:#dc2626;border-color:#fecaca;}
.stkc.b{color:#1a1d23;}
.stkc.w{color:#7c3aed;border-color:#ddd6fe;background:#f5f3ff;}
.stk2x{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;
  background:#fef3c7;color:#b45309;border:1px solid #fde68a;border-radius:5px;
  padding:1px 5px;margin-left:6px;}
.stk2x.off{background:#f3f4f6;color:#9ca3af;border-color:#e5e7eb;}
.stkcfg{display:grid;grid-template-columns:46px 1fr 32px;gap:7px 8px;font-size:10px;
  align-items:center;margin-top:4px;}
.stkcfg label{color:#6b7280;font-weight:600;}
.stkcfg select{width:100%;font-size:10px;padding:2px 4px;}
.stkcfg input[type=range]{width:100%;height:3px;accent-color:#3b5bdb;min-width:0;}
.stkcfg span{font-feature-settings:"tnum";color:#1a1d23;font-weight:700;text-align:right;}
.supply{margin-top:9px;border-top:1px solid #f1f3f7;padding-top:8px;
  font-size:10px;line-height:1.55;color:#4b5563;}
.supply .hd{font-size:9px;font-weight:700;color:#9ca3af;letter-spacing:.5px;
  margin-bottom:4px;}
.supply .st{display:inline-block;font-size:9px;font-weight:700;border-radius:5px;
  padding:1px 6px;margin-right:5px;}
.st.keep{background:#ecfdf5;color:#047857;}
.st.adjust,.st.replan{background:#eef2ff;color:#3730a3;}
.st.reband{background:#fffbeb;color:#b45309;}
.st.live{background:#fef2f2;color:#b91c1c;}
.st.ec{background:#f5f3ff;color:#7c3aed;}
.st.economy,.st.endLevel{background:#f3f4f6;color:#6b7280;}
/* ---- plus card obstacle ------------------------------------------------- */
.pc.plusc{background:#eeedfe;border:2px dashed #7f77dd;box-shadow:none;}
/* It fired: the badge lifts off the board and a tag carries the count to the deck. It
   used to vanish between two frames, which read as the tile simply disappearing. */
.plusfly{position:absolute;z-index:1100;pointer-events:none;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:#eeedfe;border:2px dashed #7f77dd;
  animation:plusgo .8s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes plusgo{
  0%{opacity:1;transform:scale(1);}
  26%{opacity:1;transform:scale(1.14);}
  100%{opacity:0;transform:scale(.62) translateY(30px);}
}
.plustag{position:absolute;z-index:1101;pointer-events:none;background:#534ab7;color:#fff;
  border-radius:12px;padding:5px 12px;font-size:11.5px;font-weight:800;letter-spacing:-.2px;
  white-space:nowrap;box-shadow:0 4px 14px rgba(60,52,137,.28);
  animation:plustag 1.15s ease-out forwards;}
@keyframes plustag{
  0%{opacity:0;transform:translate(-50%,4px) scale(.82);}
  16%{opacity:1;transform:translate(-50%,-16px) scale(1);}
  68%{opacity:1;transform:translate(-50%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-46px) scale(.95);}
}
/* D-005 assigns amber to the Wild, and the shipping build draws a map wild in the same
   gold as the Wild booster. It is face-up from the deal and never flips, so it stays
   legible under whatever covers it - which is the whole point of it being visible. */
/* Same face as the USE WILD control the player already knows - #fffbeb on #f2ce6a with
   #b8790a type - so the card on the board and the button off it read as one thing. */
.wildc{background:#fffbeb;border:1.5px solid #f2ce6a;}
/* The playable ring is blue for every ordinary card, which put a blue border on a yellow
   card and made the wild look like it belonged to the director rather than to itself.
   A wild keeps its own colour when it lights up - it is the one card whose whole identity
   is that it always plays, so the highlight should say louder, not different. */
/* Playable changes the EDGE only. The face stays #fffbeb whatever the state, because the
   face is what identifies the card - repainting it made the wild look like a different
   card rather than the same card in a different state. */
/* Both of these MUST restate the background. Removing the line does not keep the face -
   .pc.pl paints #eef2ff and .pc.clk:hover paints #e0e7ff, and a more specific selector
   that only sets a border leaves those in place. That is why the wild's centre went blue
   on hover while its edge stayed gold. */
.pc.wildc.pl{background:#fffbeb;border:2px solid #e0a316;}
.pc.wildc.clk:hover{background:#fffbeb;border-color:#c98f12;}
/* Refused, not broken: it dims, it takes a pointer, and it answers when tapped. */
.pc.wildno{opacity:.5;pointer-events:auto;cursor:not-allowed;}
.pc.wildno:hover{opacity:.68;}
@keyframes shk{0%,100%{transform:translateX(0)}18%{transform:translateX(-4px)}
  38%{transform:translateX(4px)}58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
.wildb.shk{animation:shk .38s ease;}
.wildb{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.wildb .wl{font-size:.62em;font-weight:800;letter-spacing:.06em;color:#b8790a;}
.wgold{display:inline-flex;align-items:center;gap:4px;color:#b8790a;}
.wgold .sy{color:#b8790a;font-size:9px;font-weight:800;letter-spacing:.3px;}
/* Two ranks stacked with a rule, both pips in the corner. Sizes are in em, NOT px: the
   board scales every card by SC and render() sets each card's font-size from its own
   width, so a fixed 19px rank overflows the 44px card a dense board draws. */
/* No border of its own: it wears the same edge as every other card, and takes the blue
   playable ring like any of them. A double is an ordinary card that answers one extra
   rank - the stacked ranks and the 1.35x size carry the identity, the ring carries the
   state. That is the opposite of the wild, which is its own category and keeps its own
   colour when it lights up.
   Sized in em throughout: the board scales cards by SC and render() sets each card's
   font-size from its own width, so px here would overflow the 44px card a dense board
   draws. An ordinary rank is 1em, so .95em puts these within a hair of their neighbours
   before the 1.35x is applied on top. */
.dblb{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.1em;width:100%;height:100%;}
/* No negative letter-spacing here. It subtracts from the advance width AFTER the glyph,
   so a single-character rank sits in a box narrower than its own ink and flex centres the
   BOX, not the letter - which reads as the text drifting sideways once the rank is 34px.
   Full-width blocks with text-align:center remove the question entirely, and 10 is the
   only two-character rank so nothing needed tightening anyway. */
.dblb .rk{font-size:1.3em;font-weight:800;line-height:1;width:100%;text-align:center;
  color:#1a1d23;}
.dblc.red .dblb .rk{color:#dc2626;}
.dblb .rule{width:1.15em;height:1.5px;border-radius:1px;background:#c3c8d4;}
.dblc.red .dblb .rule{background:#f0b4b4;}
.dblb .su{position:absolute;right:.16em;top:.1em;font-size:.8em;font-weight:600;
  line-height:.86;text-align:center;color:#1a1d23;}
.dblc.red .dblb .su{color:#dc2626;}
/* Lock & Key. Two tiles that answer only each other: never matched against the head
   card, and collecting the pair costs no deck card. One face for both halves so the pair
   reads as a single mechanic - only the icon and the caption differ. The face is pinned
   in every state for the same reason the wild's is: the face identifies the card, so the
   edge is what moves. */
/* .pc is pointer-events:none and only .clk re-enables it. A lock or key never gets .clk -
   legals() excludes it, so it is never a match target - which means without this the tile
   paints correctly and cannot be clicked at all. */
.pc.lkc{background:#fdf2f8;border:1.5px solid #f0a5c8;box-shadow:none;
  pointer-events:auto;cursor:pointer;}
.pc.lkc.clk:hover,.pc.lkc:hover{background:#fdf2f8;border-color:#be185d;}
.pc.lkc.lkno{opacity:.62;}
.pc.lkc.lkno:hover{opacity:.8;}
.lkb{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.16em;width:100%;height:100%;color:#be2361;}
.lkb svg{width:1.45em;height:1.45em;display:block;fill:currentColor;}
.lkb .cap{font-size:.42em;font-weight:800;letter-spacing:.1em;line-height:1;}
.lkb.shk{animation:shk .38s ease;}
/* Only the KEY lights up. The lock is the passive target and the shipping hint pass
   never highlights it, even though tapping it works. */
@keyframes lkp{0%,100%{box-shadow:0 0 0 0 rgba(219,39,119,.55)}
  70%{box-shadow:0 0 0 8px rgba(219,39,119,0)}}
.pc.lkc.lkrdy{border-color:#db2777;animation:lkp 1.5s ease-out infinite;cursor:pointer;}
/* Up & Down. The card is a window onto the rank ring: the rank it is leaving above, what
   it is worth now in the middle, the rank it steps to next below. Reading DOWNWARD is
   reading forward in time whichever way the tile counts, so an up card at 7 reads 6/7/8
   and a down card at 7 reads 8/7/6 - the ghost at the bottom is always where it is headed.
   The arrow rides beside the rank because that is the pair a player reads together: what
   it is worth, and which way that is about to move. Ordinary card face and border, because
   it IS an ordinary matchable card.
   Rank, suit and arrow all take the card's colour; only the ghosts stay grey, so the two
   ranks that are not in play cannot be mistaken for the one that is. */
.pc.udc{background:#fff;border:1.5px solid #d7dae3;}
.udb{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.06em;width:100%;height:100%;line-height:1;color:#1a1d23;}
.udc.red .udb{color:#dc2626;}
/* right/top in em resolve against the pip's OWN font-size, so the offsets have to grow when
   the pip does or it ends up tighter, not looser: .14em on a .62em pip is about 1.5px, which
   put it inside the 7px corner radius and half-swallowed it. */
.udb .sy{position:absolute;right:.32em;top:.3em;font-size:.74em;line-height:1;}
.udb .gh{font-size:.64em;font-weight:700;color:#cfd3dc;}
/* align-items:center, NOT flex-start. flex-start pins the arrow to the cap height of the
   digit, which reads as a superscript hanging off the corner; the arrow belongs on the
   digit's own centre line, beside it rather than above it. */
.udb .rk{font-size:1.3em;font-weight:800;display:flex;align-items:center;gap:.06em;}
.udb .rk .ar{font-size:.5em;line-height:1;}
/* The per-step tell. The shipping build has this written and commented out, which is why
   these levels read as random rather than tricky: the rank changes by a silent sprite swap
   and nothing draws the eye to the moment your target moved. Box-shadow only - .pc carries
   an inline rotate, and animating transform here would throw a rotated card straight. */
/* The ring takes the CARD's colour, like the rank, the pip and the arrow do - amber was a
   fourth colour on a card that already has exactly one. Carried as raw RGB components in a
   custom property so the same keyframe can fade either of them out to zero alpha. */
@keyframes udpop{0%{box-shadow:0 0 0 0 rgba(var(--udring),.55)}
  100%{box-shadow:0 0 0 8px rgba(var(--udring),0)}}
.pc.udc{--udring:26,29,35;}
.pc.udc.red{--udring:220,38,38;}
.pc.udc.udf{animation:udpop .52s ease-out;}
.plusb{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100%;line-height:1;}
.plusb .pv{font-size:22px;font-weight:800;letter-spacing:-1px;color:#3c3489;line-height:1;}
.plusb .pl{font-size:7.5px;font-weight:700;letter-spacing:.5px;color:#534ab7;
  margin-top:3px;text-align:center;line-height:1.25;}
.deckgrew{position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  background:#534ab7;color:#fff;font-size:9px;font-weight:800;border-radius:8px;
  padding:1px 6px;white-space:nowrap;animation:dgrew 1.3s ease-out forwards;}
@keyframes dgrew{0%{opacity:0;transform:translate(-50%,6px);}
  20%{opacity:1;transform:translate(-50%,0);}
  75%{opacity:1;transform:translate(-50%,0);}
  100%{opacity:0;transform:translate(-50%,-8px);}}
</style>
</head>
<body>
<div class="dropzone">Drop a folder of level JSON files</div>
<div class="page">
  <div class="hdr">
    <div class="brand">
      <div class="brand-mark">TP</div>
      <div><div class="brand-name">Adaptive Experience Director</div>
        <div class="brand-sub">TriPeaks level generation &amp; verification</div></div>
    </div>
    <div class="tag" id="tagline">Verified</div>
  </div>

  <div class="ctlbar">
    <select id="lsel"></select>
    <select id="tsel"></select>
    <span class="mixctl" title="Colour mix - the share of cards the director deals black. The streak meter pays a bonus for five cards of ONE colour, so this decides how often that bonus can fire at all. Applied on the next Generate, like the outcome beside it.">
      <span class="mixlab">Suits</span>
      <input type="range" id="csel" min="0" max="100" step="5" value="50"
             oninput="mixSlide(this.value)" aria-label="Colour mix, percent black">
      <span class="mixval" id="cselv">50 / 50</span>
    </span>
    <button class="pri" onclick="build()">Generate level</button>
    <button id="flbtn" onclick="toggleForceLive()">Director: auto</button>
    <button onclick="pickFolder()">Load levels…</button>
    <input type="file" id="filein" accept=".json,application/json" multiple webkitdirectory
           style="display:none" onchange="ingest([].slice.call(this.files))">
    <!-- Hidden, not deleted. All three still work and their panels still render; they are
         batch tools that crowd a bar meant for one level at a time. Drop the style to get
         them back, or call validateAll() / botStart() / ecSweepStart() from the console. -->
    <button onclick="validateAll()" style="display:none">Validate all…</button>
    <button onclick="botStart()" style="display:none">Run bot…</button>
    <button onclick="ecSweepStart()" style="display:none">Rescue sweep…</button>
    <span class="loadmsg" id="loadmsg"></span>
    <span class="seedtxt" id="sd"></span>
  </div>

  <div class="batchbox" id="botbox" style="display:none">
    <div class="bbrow">
      <span class="bblabel">Bot agent</span>
      <select id="botp" style="width:auto">
        <option value="5">5 playthroughs each</option>
        <option value="10" selected>10 playthroughs each</option>
        <option value="25">25 playthroughs each</option>
        <option value="50">50 playthroughs each</option>
      </select>
      <span id="botstop"><button onclick="botStop()">Stop</button></span>
      <span id="botbtns" style="display:none">
        <button onclick="botCSV()">Download report (CSV)</button>
        <button onclick="botClear()">Clear</button>
      </span>
    </div>
    <div class="bbtrack"><div class="bbfill" id="botbar"></div></div>
    <div class="bbtxt" id="bottxt"></div>
    <div class="bblist" id="botlist"></div>
  </div>

  <div class="batchbox" id="ecbox" style="display:none">
    <div class="bbrow">
      <span class="bblabel">Rescue sweep</span>
      <select id="ecpreset" style="width:auto" onchange="ecPreset(this.value)">
        <option value="0">Ruthlessness 0 \u00b7 as built</option>
        <option value="0.25">Ruthlessness 0.25</option>
        <option value="0.5">Ruthlessness 0.5</option>
        <option value="0.75">Ruthlessness 0.75</option>
        <option value="1">Ruthlessness 1 \u00b7 hardest</option>
      </select>
      <select id="ecruns" style="width:auto">
        <option value="1">1 pass</option>
        <option value="3" selected>3 passes</option>
        <option value="6">6 passes</option>
      </select>
      <button onclick="ecSweepStop()">Stop</button>
      <span id="ecsweepbtns" style="display:none">
        <button onclick="ecSweepCSV()">Download report (CSV)</button>
        <button onclick="ecEventsCSV()">Telemetry (CSV)</button>
        <button onclick="stkEventsCSV()">Streak rewards (CSV)</button>
        <button onclick="ecSweepClear()">Clear</button>
      </span>
    </div>
    <div class="bbtrack"><div class="bbfill" id="ecbar"></div></div>
    <div class="bbtxt" id="ectxt"></div>

  if(!SCROLL)return 0;
  let mn=Infinity;
  for(let i=0;i<N;i++)if(!isGone(i)&&XPOS[i]<mn)mn=XPOS[i];
  return mn===Infinity?0:mn-SCROLL_ANCHOR;
}
function inView(i,S){return !SCROLL||(XPOS[i]-S)<SCROLL_CLAMP;}
const lx=i=>Math.round((POS[i][0]-VS-X0)*SC)+OFX;
const ty=i=>Math.round((Y1-POS[i][1])*SC)+OFY;
const nb=r=>r===WILD_RANK?ALL.slice():[r===1?13:r-1,r===13?1:r+1];
const cyc=(a,b)=>{
  if(a===WILD_RANK||b===WILD_RANK)return true;   // a wild waste matches everything
  const q=Math.abs(a-b);return q===1||q===12;};
const pays=Q=>Math.floor(Q/PIPS);

let FAIL={};
function fail(k){FAIL[k]=(FAIL[k]||0)+1;return null;}
function feasR(T,used){const a=[];
  for(let R=2;R<=T;R++)if(R-1<=used&&used-(R-1)>=0&&used-(R-1)<=2*(R-1))a.push(R);
  return a;}
function graphIssues(){
  const indeg=[],adj=[];
  for(let i=0;i<N;i++){adj.push([]);indeg.push(0);}
  for(let i=0;i<N;i++)for(const p of (DEP[i]||[])){adj[p].push(i);indeg[i]++;}
  const q=[];for(let i=0;i<N;i++)if(indeg[i]===0)q.push(i);
  let seen=0;
  while(q.length){const x=q.pop();seen++;
    for(const y of adj[x])if(--indeg[y]===0)q.push(y);}
  return {cycle:N-seen,roots:ROOTS};
}
function whyNot(tgt){
  const rows=[];
  for(let tv=tgt.lo;tv<=tgt.hi;tv++){
    const T=tgt.win?N:N-tv, used=tgt.win?DRAWS-tv:DRAWS;
    let why=null;
    if(tgt.win&&tv>DRAWS)why='wants '+tv+' unused draws, but the level only has '+DRAWS;
    else if(used<0)why='draw budget goes negative';
    else if(T<3)why='only '+T+' cards would be cleared \u2014 too few to shape';
    else if(used===0){/* single-run mode covers zero-draw levels */}
    else{
      const fr=feasR(T,used);
      if(!fr.length)why=used+' draw'+(used===1?'':'s')+' to spend cannot split into runs plus dead draws';
      else if(fr[fr.length-1]*9<T)why='at most '+fr[fr.length-1]+' runs of 9 cards covers '+
        (fr[fr.length-1]*9)+', short of '+T;
    }
    rows.push([tv,why]);}
  return rows;
}
function minDeckFor(tgt){
  for(let dn=1;dn<=60;dn++){
    if(N+dn>52)break;
    const dr=dn-1;
    for(let tv=tgt.lo;tv<=tgt.hi;tv++){
      const T=tgt.win?N:N-tv, used=tgt.win?dr-tv:dr;
      if(used<0||T<3)continue;
      if(!tgt.win&&used===0)continue;
      const fr=feasR(T,used);
      if(!fr.length)continue;
      if(fr[fr.length-1]*9<T)continue;
      return dn;}}
  return null;
}

function compose(rem,slots,al,rng){
  if(slots===0)return rem===0?[]:null;
  const lo=Math.min.apply(null,al),hi=Math.max.apply(null,al);
  if(rem<slots*lo||rem>slots*hi)return null;
  for(let t=0;t<250;t++){const v=[];let r=rem,ok=true;
    for(let i=0;i<slots;i++){const lf=slots-i-1,c=al.filter(x=>r-x>=lf*lo&&r-x<=lf*hi);
      if(!c.length){ok=false;break;}
      const p=c[Math.floor(rng()*c.length)];v.push(p);r-=p;}
    if(ok&&r===0)return v;}
  return null;
}
function buildRuns(T,used,clamp,isLose,rng){
  if(used===0)return {ln:[T],dl:[],dead:0,clamp:clamp,needPay:T>=PIPS};
  const DEN=[4,9].filter(x=>x<=clamp),NON=[1,2,3,5,6,7,8].filter(x=>x<=clamp);
  if(!DEN.length)return null;
  const fs=[];for(let R=2;R<=T;R++)if(R-1<=used&&used-(R-1)>=0&&used-(R-1)<=2*(R-1))fs.push(R);
  if(!fs.length)return null;
  let mx=0;
  for(const R of fs)for(const dv of DEN){const rem=T-dv,sl=R-1;
    if(sl>=1&&rem>=sl)mx=Math.max(mx,Math.min(clamp,rem-(sl-1)),dv);}
  const needPay=mx>=PIPS;
  for(let i=fs.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=fs[i];fs[i]=fs[j];fs[j]=t;}
  for(const R of fs.slice(0,10))for(let t=0;t<90;t++){
    const dc=1+Math.floor(rng()*Math.min(3,R-1)),dv=[];
    for(let i=0;i<dc;i++)dv.push(DEN[Math.floor(rng()*DEN.length)]);
    const body=compose(T-dv.reduce((a,b)=>a+b,0),R-dc,NON,rng);
    if(!body)continue;
    const sl=[];for(let i=0;i<R;i++)sl.push(i);
    for(let i=sl.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const q=sl[i];sl[i]=sl[j];sl[j]=q;}
    const dp=new Set(sl.slice(0,dc)),ln=[];let a=0,b=0;
    for(let i=0;i<R;i++){if(dp.has(i))ln.push(dv[a++]);else ln.push(body[b++]);}
    if(needPay&&ln.reduce((x,y)=>x+pays(y),0)<1)continue;
    if(isLose){if(ln[R-1]<3)continue;if(ln[0]>Math.max(4,Math.ceil(T/R)))continue;
      if(needPay){let lt=0;for(let i=Math.floor(R/2);i<R;i++)lt+=pays(ln[i]);if(lt<1)continue;}}
    const dl=[];for(let i=0;i<R;i++)if(dp.has(i))dl.push(i+1);
    return {ln,dl,dead:used-(R-1),clamp,needPay};}
  return null;
}
// ==== PACING PREFERENCE =======================================================
// D-007 rejected chain shape as a FILTER inside buildRuns: deleting partitions before
// the prover converts yield loss one-for-one into live levels, because PLAN has a single
// verified stage. This is the same taste applied strictly DOWNSTREAM of exh() - every
// candidate scored here has already been proved - so a preference can never empty a
// non-empty pool and verified coverage cannot move. If one candidate proves, it ships,
// exactly as before.
//
// Deterministic on purpose: not one rnd() call, so the build's random stream is byte for
// byte what it was and no marginal level can be shifted off its seed by scoring.
const PACE={K:4, extraMs:250,
  endShort:-22, endLong:8, stutter:-7, stutterPair:-10, lateDead:-9,
  noRelease:-20, releaseGap:-3, frontLoad:-14};
function paceScore(g){
  const ln=g.ln||[], R=ln.length;
  if(!R)return 0;
  const T=ln.reduce(function(a,b){return a+b;},0)||1;
  const cum=[];let c=0;for(let j=0;j<R;j++){c+=ln[j];cum.push(c);}
  let s=0;
  // The ending. D-007's own metric: a level that finishes on a single match reads as one
  // that ran out rather than one that was finished.
  if(ln[R-1]<3)s+=PACE.endShort; else if(ln[R-1]>=5)s+=PACE.endLong;
  // Stutter - single-match runs, worse back to back.
  for(let j=0;j<R;j++)if(ln[j]===1){s+=PACE.stutter;if(j>0&&ln[j-1]===1)s+=PACE.stutterPair;}
  // Dead draws parked in the last quarter. This term is "the back half is padding".
  const gaps=g.gaps||[];
  for(let j=0;j<gaps.length&&j<cum.length;j++)
    if(gaps[j]>0&&cum[j]/T>0.75)s+=PACE.lateDead*gaps[j];
  // A squeeze has to resolve: after the last denial there should be a payout, and soon.
  // This is the tension-relief term.
  const dl=g.dl||[];
  if(dl.length){
    let last=0;for(let k=0;k<dl.length;k++)if(dl[k]-1>last)last=dl[k]-1;
    let at=-1;for(let j=last+1;j<R;j++)if(pays(ln[j])>=1){at=j;break;}
    s+=(at<0)?PACE.noRelease:PACE.releaseGap*Math.min(8,at-last);
  }
  // Q-003's softer form, delivered as a preference rather than the gate it was posed as:
  // the longest chain merely should not sit in the first quarter. Placed by its midpoint,
  // so a long run straddling the line is judged by its centre of mass.
  let mi=0;for(let j=1;j<R;j++)if(ln[j]>ln[mi])mi=j;
  if((cum[mi]-ln[mi]/2)/T<0.25)s+=PACE.frontLoad;
  return s;
}
// Argmax, first wins ties. No random tie-break: see the determinism note above.
function pickBest(pool){
  let best=pool[0];
  for(let i=1;i<pool.length;i++)if(pool[i].pace>best.pace)best=pool[i];
  return best;
}
function gen(tgt,tv,rng,mode){
  // tier 0 is the original generator, untouched. tiers 1 and 2 only ever run after
  // tier 0 has exhausted the whole band, so levels that build today are unaffected.
  mode=mode||0;
  const T=tgt.win?N:N-tv,used=tgt.win?DRAWS-tv:DRAWS;
  if(used<0||T<3)return fail('budget');
  const br=buildRuns(T,used,6+Math.floor(rng()*4),!tgt.win,rng);
  if(!br)return fail('partition');
  const ln=br.ln,R=ln.length;
  const gi=[];for(let i=0;i<Math.max(R-1,1);i++)gi.push(i);
  for(let i=gi.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=gi[i];gi[i]=gi[j];gi[j]=t;}
  const gaps=new Array(Math.max(R-1,1)).fill(0);let rm=br.dead;
  for(const g of gi){if(rm<=0)break;gaps[g]=1;rm--;}
  for(const g of gi){if(rm<=0)break;gaps[g]=2;rm--;}
  if(rm>0)return fail('deadDraws');
  const rank={},sup={},rmv=new Set(),ev=[];ALL.forEach(r=>sup[r]=SUP);
  const rich=cs=>{if(!cs.length)return undefined;
    let t=0;for(const c of cs)t+=sup[c];
    if(t<=0)return cs[Math.floor(rng()*cs.length)];
    let x=rng()*t;for(const c of cs){x-=sup[c];if(x<=0)return c;}return cs[cs.length-1];};
  const exp=()=>{const S=scrollOf(function(z){return rmv.has(z);});const a=[];
    for(let i=0;i<N;i++)if(!rmv.has(i)&&(DEP[i]||[]).every(p=>rmv.has(p))&&inView(i,S))a.push(i);
    return a;};
  const pk=a=>a[Math.floor(rng()*a.length)];
  let dir=0,w=null,seed=null;
  // tiers 1 and 2: keep walking the same way round the rank circle. a monotone run of
  // length L touches L distinct ranks; an oscillating one hammers two. that is what drains supply.
  const step=cs=>{
    if(mode>=1&&dir&&cs.length>1&&w!==null){
      const want=dir>0?(w===13?1:w+1):(w===1?13:w-1);
      if(cs.indexOf(want)>=0&&sup[want]>=1)return want;}
    return rich(cs);};
  const setDir=(from,to)=>{if(from===null)return;dir=(to===(from===13?1:from+1))?1:-1;};

  if(mode>=2){
    // tableau first, deck last. the tableau walk is the constrained half; deck ranks are
    // nearly free, so letting them take the leftovers stops the walk starving mid-chain.
    const firstRank=[],forb={};
    if(mode===3)for(let i=0;i<N;i++)forb[i]=new Set();
    const allow=(nd,arr)=>mode===3?arr.filter(r=>!forb[nd].has(r)):arr;
    const bar=keep=>{if(mode!==3)return;
      for(const y of exp())if(y!==keep)nb(w).forEach(x=>forb[y].add(x));};
    const urgent=arr=>{if(mode!==3||arr.length<2)return arr[Math.floor(rng()*arr.length)];
      let mx=-1;for(const x of arr)if(forb[x].size>mx)mx=forb[x].size;
      const top=arr.filter(x=>forb[x].size===mx);
      return top[Math.floor(rng()*top.length)];};
    const urgentPair=opts=>{if(mode!==3||opts.length<2)return opts[Math.floor(rng()*opts.length)];
      let mx=-1;for(const o of opts)if(forb[o[0]].size>mx)mx=forb[o[0]].size;
      const top=opts.filter(o=>forb[o[0]].size===mx);
      return top[Math.floor(rng()*top.length)];};
    for(let j=0;j<R;j++){
      const e=exp();if(!e.length)return fail('blocked');
      const nd=urgent(e),c0=allow(nd,ALL.filter(r=>sup[r]>0));
      if(!c0.length)return fail('supply');
      const r0=rich(c0);rank[nd]=r0;sup[r0]--;rmv.add(nd);
      firstRank.push(r0);w=r0;dir=0;ev.push({t:'p',i:nd});
      for(let i=1;i<ln[j];i++){
        const e2=exp();if(!e2.length)return fail('blocked');
        const opts=[];
        for(const n3 of e2){const c3=allow(n3,nb(w).filter(x=>sup[x]>0));if(c3.length)opts.push([n3,c3]);}
        if(!opts.length)return fail('supply');
        const pr=urgentPair(opts);
        const n2=pr[0],r2=step(pr[1]);
        bar(n2);
        rank[n2]=r2;sup[r2]--;rmv.add(n2);setDir(w,r2);w=r2;ev.push({t:'p',i:n2});}
      bar(null);}
    if(rmv.size!==T)return fail('coverage');
    for(let i=0;i<N;i++)if(rank[i]===undefined){
      const c=dblFilter(i,allow(i,ALL.filter(r=>sup[r]>0)));if(!c.length)return fail('supply');
      const r=rich(c);rank[i]=r;sup[r]--;}
    const sc=nb(firstRank[0]).filter(x=>sup[x]>0);
    if(!sc.length)return fail('supply');
    seed=rich(sc);sup[seed]--;
    const ign=[];
    for(let j=1;j<R;j++){
      const ic=nb(firstRank[j]).filter(x=>sup[x]>0);
      if(!ic.length)return fail('supply');
      const ig=rich(ic);sup[ig]--;ign.push(ig);}
    const dead=[];
    for(let j=1;j<R;j++){const row=[];
      for(let q=0;q<gaps[j-1];q++){
        const av=ALL.filter(r=>sup[r]>0);if(!av.length)return fail('supply');
        const r=rich(av);sup[r]--;row.push(r);}
      dead.push(row);}
    const deckR=[];
    for(let j=1;j<R;j++){for(const r of dead[j-1])deckR.push(r);deckR.push(ign[j-1]);}
    for(let i=0;i<(tgt.win?tv:0);i++){
      const c=ALL.filter(r=>sup[r]>0);if(!c.length)return fail('supply');
      const r=rich(c);sup[r]--;deckR.push(r);}
    const usd2={};ALL.forEach(r=>usd2[r]=0);
    const lab2=r=>{const L=mixLabel(r,usd2[r]||0);usd2[r]++;return L;};
    const sd2=lab2(seed),LB2=[],deck2=[];
    for(const r of deckR){const Q=lab2(r);deck2.push([Q[0]+Q[1],r,Q[2]]);}
    for(const e of ev)if(e.t==='p')LB2[e.i]=lab2(rank[e.i]);
    for(let i=0;i<N;i++)if(!LB2[i])LB2[i]=lab2(rank[i]);
    return {rank:rank,LB:LB2,deck:deck2,seed:seed,seedCard:sd2,ln:br.ln,dl:br.dl,clamp:br.clamp,
      gaps:gaps.slice(),dead:br.dead,needPay:br.needPay,
      pay:br.ln.reduce((a,b)=>a+pays(b),0),mode:mode};
  }

  for(let j=0;j<R;j++){
    if(j>0){
      for(let q=0;q<gaps[j-1];q++){const av=ALL.filter(r=>sup[r]>0);if(!av.length)return fail('supply');
        const r=rich(av);sup[r]--;w=r;ev.push({t:'d',r:r});}
      const e=exp();if(!e.length)return fail('blocked');
      const nd=pk(e),rc=ALL.filter(r=>sup[r]>0);if(!rc.length)return fail('supply');
      const nr=rich(rc),ic=nb(nr).filter(x=>sup[x]>0);if(!ic.length)return fail('supply');
      const ig=rich(ic);sup[ig]--;w=ig;ev.push({t:'d',r:ig});
      rank[nd]=nr;sup[nr]--;rmv.add(nd);setDir(ig,nr);w=nr;ev.push({t:'p',i:nd});
    }else{
      const e=exp(),nd=pk(e),r1=rich(ALL.filter(r=>sup[r]>0));
      if(r1===undefined)return fail('supply');
      const sc=nb(r1).filter(x=>sup[x]>0);if(!sc.length)return fail('supply');
      seed=rich(sc);sup[seed]--;rank[nd]=r1;sup[r1]--;rmv.add(nd);setDir(seed,r1);w=r1;ev.push({t:'p',i:nd});}
    for(let i=1;i<ln[j];i++){
      const e2=exp();if(!e2.length)return fail('blocked');
      const c=nb(w).filter(x=>sup[x]>0);if(!c.length)return fail('supply');
      const n2=pk(e2),r2=step(c);rank[n2]=r2;sup[r2]--;rmv.add(n2);setDir(w,r2);w=r2;ev.push({t:'p',i:n2});}}
  if(rmv.size!==T)return fail('coverage');
  for(let i=0;i<N;i++)if(rank[i]===undefined){
    const c=dblFilter(i,ALL.filter(r=>sup[r]>0));if(!c.length)return fail('supply');
    const r=rich(c);rank[i]=r;sup[r]--;}
  const sp=[];for(let i=0;i<(tgt.win?tv:0);i++){
    const c=ALL.filter(r=>sup[r]>0);if(!c.length)return fail('supply');const r=rich(c);sup[r]--;sp.push(r);}
  const usd={};ALL.forEach(r=>usd[r]=0);
  const lab=r=>{const L=mixLabel(r,usd[r]||0);usd[r]++;return L;};
  const sd=lab(seed),LB=[],deck=[];
  for(const r of ev.filter(e=>e.t==='d').map(e=>e.r).concat(sp)){const Q=lab(r);deck.push([Q[0]+Q[1],r,Q[2]]);}
  for(const e of ev)if(e.t==='p')LB[e.i]=lab(rank[e.i]);
  for(let i=0;i<N;i++)if(!LB[i])LB[i]=lab(rank[i]);
  return {rank,LB,deck,seed,seedCard:sd,ln:br.ln,dl:br.dl,clamp:br.clamp,gaps:gaps.slice(),
    dead:br.dead,needPay:br.needPay,pay:br.ln.reduce((a,b)=>a+pays(b),0),mode:mode};
}
// ---- bot agent -------------------------------------------------------------
// walks every level and outcome, rebuilds each one from a fixed seed so repeat runs
// are identical, plays it many times with varied choices, and checks invariants.
let BOT=null;
function seedFor(short,ti){
  let x=2166136261>>>0;
  const s=short+'|'+ti;
  for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}
  return x||1;
}
function buildFixed(li,ti,seed){
  useLevel(li);
  document.getElementById('tsel').value=String(ti);
  srand(seed);
  SILENT=true;SYNCB=true;LV=null;BUILDING=null;
  try{build();}catch(e){SILENT=false;SYNCB=false;throw e;}
  SILENT=false;SYNCB=false;
  return LV;
}
// one playthrough. returns the result plus anything that looked wrong.
function botPlay(pseed){
  const bugs=[];
  srand(pseed);
  reset();
  let moves=0,res=null;
  while(moves++<600){
    const lg=legals();
    const leftNow=N-cl.size;
    if(leftNow===0){res={win:true,v:deckLeft()};break;}
    if(lg.length){
      const pick=lg[Math.floor(rnd()*lg.length)];
      if(!expo(pick))bugs.push('played a card that was not exposed');
      play(pick);
    }else if(deckLeft()>0){
      draw();
    }else{res={win:false,v:leftNow};break;}
  }
  if(!res)bugs.push('did not terminate within 600 moves');
  // rank supply must never be oversubscribed
  const tally={};
  for(let i=0;i<N;i++)if(LV.rank[i]!==undefined)tally[LV.rank[i]]=(tally[LV.rank[i]]||0)+1;
  // granted cards (streak rewards, rescue cards) are extra supply the game handed out,
  // not draws against the level's physical deck, so they do not count here
  for(let d=0;d<di&&d<dk.length;d++)if(!dk[d][3])tally[dk[d][1]]=(tally[dk[d][1]]||0)+1;
  tally[LV.seed]=(tally[LV.seed]||0)+1;
  for(const r in tally)if(tally[r]>SUP)bugs.push('rank '+RN[r]+' used '+tally[r]+' times, supply is '+SUP);
  if(LV.live&&LV.pool)for(const r in LV.pool)if(LV.pool[r]<0)bugs.push('live pool went negative on '+RN[r]);
  return {res:res,bugs:bugs};
}
function botStart(){
  if(BOT||BUILDING)return;
  const plays=+document.getElementById('botp').value;
  BOT={li:0,ti:0,done:0,total:LEVELS.length*OUT.length,plays:plays,rows:[],
       t0:Date.now(),stop:false,pass:0,fail:0,bugs:0,blocked:0};
  document.getElementById('botbox').style.display='';
  document.getElementById('botbtns').style.display='none';
  document.getElementById('botstop').style.display='';
  botStep();
}
function botStop(){if(BOT)BOT.stop=true;}
function botOne(li,ti){
  const B=BOT,short=LEVELS[li].short,tgt=OUT[ti];
  const row={level:short,outcome:tgt.n,director:'-',target:'-',plays:B.plays,
             exact:0,band:0,side:0,bugs:[],verdict:'-'};
  let lv=null;
  try{lv=buildFixed(li,ti,seedFor(short,ti));}
  catch(e){row.verdict='EXCEPTION';row.bugs.push('build threw: '+e.message);
    B.bugs++;B.rows=B.rows||[];return row;}
  if(!lv){row.director='blocked';row.verdict='BLOCKED';B.blocked++;return row;}
  const live=lv.usedMode===4;
  row.director=live?'live':'verified';
  const bd=lv.band||[lv.tv,lv.tv];
  row.target=live?(bd[0]+'-'+bd[1]):String(lv.tv);
  for(let p=0;p<B.plays;p++){
    let out;
    try{out=botPlay(seedFor(short,ti)+7919*(p+1));}
    catch(e){row.bugs.push('play threw: '+e.message);continue;}
    for(const b of out.bugs)if(row.bugs.indexOf(b)<0)row.bugs.push(b);
    if(!out.res)continue;
    const r=out.res;
    if(r.win===tgt.win){row.side++;
      if(r.v>=bd[0]&&r.v<=bd[1])row.band++;
      if(r.v===lv.tv)row.exact++;}
  }
  // a verified level is a proof: anything less than every run on target is a real bug
  if(!live){
    if(row.exact===B.plays&&!row.bugs.length){row.verdict='PASS';B.pass++;}
    else{row.verdict='FAIL \u2014 verified level missed';B.fail++;
      row.bugs.push('verified but only '+row.exact+'/'+B.plays+' hit exactly '+lv.tv);}

// only ever reached when tiers 0-3 have all failed on this level.

function genLive(tgt,tv){

  const lab=r=>{const L=mixLabel(r,usd[r]||0);usd[r]++;return L;};
  const pick=cs=>{if(!cs.length)return undefined;
    let m=-1,o=[];for(const c of cs){if(pool[c]>m){m=pool[c];o=[c];}else if(pool[c]===m)o.push(c);}
    return o[Math.floor(rnd()*o.length)];};

  if(!roots.length)return null;
  const rank=[],LB=[];
  const seedR=pick(ALL.filter(r=>pool[r]>0));if(seedR===undefined)return null;
  pool[seedR]--;const seedCard=lab(seedR);

  for(const rt of roots){
    // A wild root needs no rank at all - binding one spends a card from the pool on a slot
    // the matching rule never consults. A lock or key root is the same case: it is never
    // matched, only ever collected by its partner, so its rank would be dead data.
    if(isWildSlot(rt)||isLKSlot(rt))continue;

    if(!c.length)c=ALL.filter(r=>pool[r]>0);
    // A double root must be J, Q or K, or its second value is not the adjacent rank the
    // obstacle is defined as. L111's double card IS a root, so this is the live path for it.
    if(isDblSlot(rt)){let hi=DBLROOTS.filter(function(x){return pool[x]>0;});

    base:{rank:rank.slice(),LB:LB.slice(),pool:Object.assign({},pool),usd:Object.assign({},usd)},
    rank:rank.slice(),LB:LB.slice(),pool:Object.assign({},pool),usd:Object.assign({},usd),
    seed:seedR,seedCard:seedCard,deckLen:DRAWS,deck:[],
    ln:[],dl:[],clamp:9,dead:0,pay:0,needPay:false,

function dLabel(r){const L=mixLabel(r,LV.usd[r]||0);LV.usd[r]++;return L;}
function dPick(cs){if(!cs.length)return undefined;
  let m=-1,o=[];for(const c of cs){if(LV.pool[c]>m){m=LV.pool[c];o=[c];}else if(LV.pool[c]===m)o.push(c);}
  return o[Math.floor(rnd()*o.length)];}
function dFree(){return ALL.filter(r=>LV.pool[r]>0);}
function dBind(i,r){

  // here the director assigns it, which is the premise of the whole project.
  // An over-drawn Queen is a supply rounding error and recoverable. A 7 here is a card
  // that does not exist, so the root stays in DBLROOTS even when supply says no.
  if(isDblSlot(i)){let w=DBLROOTS.filter(function(x){return LV.pool[x]>0;});
    if(!w.length)w=DBLROOTS;r=w[Math.floor(rnd()*w.length)];}

// how long the current run should be so the level still lands on the target
// cards that should actually be cleared from here. on a losing target the last
// tv cards must be left standing, so they are not part of the goal.
function dGoal(){return (N-cl.size)-(LV.tgt.win?0:LV.tv);}
function dRunLen(){
  const goal=dGoal(), C=(LV.deckLen-di)-(LV.tgt.win?LV.tv:0);
  if(goal<=0)return 0;            // enough cleared already: stall from here
  if(C<=0)return goal;            // no draws left to burn: clear the rest in one sweep
  return Math.max(1,Math.min(16,Math.ceil(goal/(C+1))));

// bind cards that just turned face up
function dChildren(i){let c=0;for(let y=0;y<N;y++)if((DEP[y]||[]).indexOf(i)>=0)c++;return c;}
function dReveal(newly){
  // A wild slot is never bound - it has no rank, and spending one from the pool on a slot
  // the matching rule ignores is the same waste the plus tiles cause. Lock and key tiles
  // are excluded for the same reason: they answer only each other, never the head card.
  newly=newly.filter(function(z){return !isWildSlot(z)&&!isLKSlot(z);});
  if(!newly.length)return;
  // lead with the card that opens the most: a chain that keeps revealing keeps running
  newly=newly.slice().sort(function(a,b){return dChildren(b)-dChildren(a);});
  // survival guard: if the board is large against the draws left, never cut a chain short
  const leftNow=N-cl.size, drawsNow=LV.deckLen-di;
  if(LV.tgt.win&&leftNow>drawsNow*1.6)RUNLEFT=Math.max(RUNLEFT,newly.length+2);
  if(!LV.tgt.win&&dGoal()<=0)RUNLEFT=0;
  // chain the revealed cards to each other, not just to the waste. otherwise a run
  // dies the moment a play reveals nothing, which burns draws we cannot spare.
  let w=wr,cont=RUNLEFT;
  for(const n of newly){
    let r;

      if(c.length){r=dPick(c);w=r;cont--;}}
    if(r===undefined){
      const inert=dFree().filter(x=>nb(wr).indexOf(x)<0&&nb(w).indexOf(x)<0);
      r=dPick(inert.length?inert:dFree());}
    if(r===undefined){r=ALL[Math.floor(rnd()*ALL.length)];  // never leave a card blank
      LV.pool[r]=(LV.pool[r]||0)+1;}                          // and never go negative
    dBind(n,r);}

// bind the card being drawn: wake the board up, or deliberately fall flat
function dDraw(){
  if(LV.wildAt&&LV.wildAt.length&&LV.wildAt.indexOf(di)>=0){
    LV.wildAt.splice(LV.wildAt.indexOf(di),1);
    return ['WILD','',false,false,true];}
  const exposedNow=[];for(let i=0;i<N;i++)if(expo(i))exposedNow.push(i);
  const goal=dGoal();
  // draws still to burn after this one. more draws than cards means some must fall flat.
  const C=(LV.deckLen-di-1)-(LV.tgt.win?LV.tv:0);
  // goal reached on a losing target: every remaining draw must land dead so the board strands
  const wantDead=exposedNow.length>0&&(goal<=0||(C>=goal&&goal>0));
  let r;
  if(wantDead){
    const dead=dFree().filter(x=>!exposedNow.some(i=>cyc(LV.rank[i],x)));
    r=dPick(dead.length?dead:dFree());
  }else{
    const cands=[];
    for(const i of exposedNow)for(const x of nb(LV.rank[i]))
      if(LV.pool[x]>0&&cands.indexOf(x)<0)cands.push(x);
    r=dPick(cands.length?cands:dFree());}

function popc(x){x=x-((x>>1)&0x55555555);x=(x&0x33333333)+((x>>2)&0x33333333);
  x=(x+(x>>4))&0x0f0f0f0f;return (x*0x01010101)>>24&0x3f;}
function exh(rank,deck,seed,win,tv,needPay){
  const memo=new Map();let cap=0,states=0,bad=false,fk=0;
  const DJR=deck.length+2;   // draw index: 0 .. deck.length, from THIS deck
  const WR=WASTE_RADIX;      // waste rank: 1..13, and WILD once it is a card
  function f(mlo,mhi,w,dj,mt){
    if(bad)return null;

    // a packed key is only sound while every field is inside its radix. If that ever
    // stops holding, refuse to verify rather than return a confident wrong proof -
    // refusing falls through to re-deal, then live, which are both safe.
    if(dj>=DJR||w>=WR||mt>=PIPS){bad=true;return null;}
    let inner=memo.get(mhi);
    if(inner===undefined){inner=new Map();memo.set(mhi,inner);}
    const key=((mlo*WR+w)*DJR+dj)*PIPS+mt;
    const hv=inner.get(key);if(hv!==undefined)return hv;

    }else{
      const lg=[];

      for(let i=0;i<N;i++){

        if((mlo&PMLO[i])!==PMLO[i]||(mhi&PMHI[i])!==PMHI[i])continue;
        if(!inView(i,Sv))continue;

function allHit(m0lo,m0hi,w0,deck,d0,win,tv,rank){

    if(++cap>90000)return false;
    if(dj>=DJR||w>=WR){unsound=true;return false;}   // cannot prove, so do not claim to
    let inner=memo.get(mhi);
    if(inner===undefined){inner=new Map();memo.set(mhi,inner);}
    const key=(mlo*WR+w)*DJR+dj;
    const hv=inner.get(key);if(hv!==undefined)return hv;
    let ok;
    if(mlo===FLO&&mhi===FHI)ok=win&&deck.length-dj===tv;
    else{
      const lg=[];
      const Sv=SCROLL?scrollOf(function(z){return !!(z<26?((mlo>>>z)&1):((mhi>>>(z-26))&1));}):0;
      for(let i=0;i<N;i++){
        if(i<26?((mlo>>>i)&1):((mhi>>>(i-26))&1))continue;
        if((mlo&PMLO[i])!==PMLO[i]||(mhi&PMHI[i])!==PMHI[i])continue;

// The partner search, and the load-bearing detail of the whole obstacle: there is no pair
// identity anywhere in the data. A tile records only 'I am a key' or 'I am a lock', so a
// tapped key takes the LOWEST-INDEX eligible lock on the board - never the nearest one,
// never necessarily the one the layout visibly pairs it with. Measured across the shipping
// levels, that is not the nearest lock for 48% of keys on multi-pair levels.
function lkFirst(S){
  for(let i=0;i<N;i++)if(S.has(i)&&!cl.has(i)&&expo(i)&&onScreen(i))return i;
  return -1;}
function lkReady(){return lkFirst(KEYS)>=0&&lkFirst(LOCKS)>=0;}
function lkNearest(from,S){let best=-1,bd=Infinity;
  for(let i=0;i<N;i++){if(!S.has(i)||cl.has(i)||!expo(i)||!onScreen(i))continue;
    const dx=POS[i][0]-POS[from][0],dy=POS[i][1]-POS[from][1],d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=i;}}
  return best;}
// A revealed half with no partner yet is inert. Shipping logs 'No PairCards Founded.' and
// the tap does nothing at all, which reads as a broken card; say why instead.
function lkRefused(i){
  SHAKE=i;beat='Blocked';
  note=isKeySlot(i)
    ?'This key has no lock to open yet \u2014 uncover a lock and the pair comes off together.'
    :'This lock has no key yet \u2014 the key must be uncovered before the pair can be collected.';
  render();
  setTimeout(function(){SHAKE=-1;render();},420);}
// Tapping the LOCK is redirected onto a key - shipping re-enters the click on the partner,
// so only the key ever runs the collect. The lock is then chosen again from scratch, which
// means tapping one lock can collect a different one.
function lkTap(i){
  const key=isKeySlot(i)?i:lkFirst(KEYS);
  if(key<0)return lkRefused(i);
  const lock=lkFirst(LOCKS);
  if(lock<0)return lkRefused(i);
  lkCollect(key,lock);}
function lkCollect(key,lock){
  // Shipping wipes the ENTIRE undo history for the level on a pair collect, not just this
  // move. That is a consequence the player feels, so the demo does it too.
  stack.length=0;
  const near=lkNearest(key,LOCKS);
  cl.add(key);cl.add(lock);scrollAdvance();
  LKDONE.push([key,lock]);
  // No deck card is spent, no head card changes, and k does not move: a pair collect is
  // not a match, so it can neither feed nor break the streak meter. What it DOES do is
  // uncover cards, and on a live level those have to be bound the same as after a play.
  const rv=unl(key)+unl(lock);
  const nw=[];for(let z=0;z<N;z++)if(!cl.has(z)&&LV.rank[z]===undefined&&expo(z))nw.push(z);
  if(ecInRescue()&&EC){EC.opened+=nw.length;ecReveal(nw);}
  else if(LV.live)dReveal(nw);
  plusSweep();
  const lf=N-cl.size;
  act='Unlock pair';log.push({t:'k',s:'PAIR'});
  beat=lf===0?'Payoff':'Unlock';
  let n='Key '+key+' opened lock '+lock+' \u2014 two cards off the board for one tap, no '+
    'deck card spent, and the streak meter does not move. ';
  n+=rv>0?('Unblocks '+rv+' card'+(rv>1?'s':'')+'. '):'Nothing new opens. ';
  if(near>=0&&near!==lock)
    n+='The nearest lock was '+near+'. The pair search takes the lowest slot index on the '+
      'board rather than the nearest tile, so the key crossed to a lock the layout does not '+
      'pair it with \u2014 which branch opens is decided by slot numbering, not by you. ';
  n+='Undo history is cleared by a pair collect.';
  note=n;
  render();}
// The clock. Every completed move steps every revealed, on-screen tile by exactly one:
// a match, a deck draw, or spending a wild. Not a timer, not a trigger, and never a tap on
// the tile itself - it is a bystander that moves because something else happened, which is
// exactly what makes it hard to plan against. `pre` is the eligible set captured BEFORE the
// move revealed anything, because a tile uncovered by this move does not step on this move.
function udTick(dir,pre){
  if(!UDN||!LV)return 0;
  const list=pre||udLive();
  let n=0;
  for(const i of list){
    if(cl.has(i)||LV.rank[i]===undefined)continue;
    const was=LV.rank[i], r=udWrap(was+UPDN[i]*dir);
    LV.rank[i]=r;
    // The suit never moves - only the rank does - so the label keeps its pip and its colour.
    const L=LV.LB[i];if(L)LV.LB[i]=[RN[r],L[1],L[2]];
    // The physical card is the same card being repainted, so the deck's composition does not
    // change - but what the BOARD shows does, and the live director picks future cards from
    // that. Hand the old rank back and take the new one so the model stays truthful.
    if(LV.pool){LV.pool[was]=(LV.pool[was]||0)+1;LV.pool[r]=(LV.pool[r]||0)-1;}
    UDFLASH.add(i);n++;}
  if(n&&!SILENT)setTimeout(function(){UDFLASH=new Set();render();},520);
  return n;}
const legals=()=>{const a=[];
  for(let i=0;i<N;i++){
    if(isPlusCard(i))continue;                  // a plus tile is never a match target
    if(isLKSlot(i))continue;                    // nor a lock or key: they answer only each other
    if(expo(i)&&onScreen(i)&&slotTakes(i,wr))a.push(i);}
  return a;};
const unl=i=>{let c=0;for(let n=0;n<N;n++){const ps=DEP[n]||[];
  if(ps.indexOf(i)>=0&&ps.every(p=>p===i||cl.has(p)))c++;}return c;};
const bleft=i=>(DEP[i]||[]).filter(p=>!cl.has(p)).length;
const maskOf=()=>{let a=0,b=0;cl.forEach(i=>{if(i<26)a|=1<<i;else b|=1<<(i-26);});return [a,b];};
function avail(){const A=[],on=[];
  const f=i=>{if(A[i]!==undefined)return A[i];if(cl.has(i)||expo(i))return A[i]=0;
    if(on[i])return A[i]=4;
    on[i]=1;let d=0;
    for(const p of(DEP[i]||[]))if(!cl.has(p))d=Math.max(d,f(p));
    on[i]=0;return A[i]=d+1;};

function build(){

  // A colour mix can only show up in cards that have not been dealt yet, so applying it at
  // any other moment would claim an effect the board does not have.
  const cs=document.getElementById('csel');if(cs)setColorMix((+cs.value)/100);
  const tgt=OUT[+document.getElementById('tsel').value];
  document.getElementById('bsub').textContent=L.short;
  document.getElementById('movetag').textContent='Move 0';
  const dtb=document.getElementById('dirtag');dtb.textContent='';dtb.className='dirtag';
  FAIL={};
  const feas=whyNot(tgt).filter(r=>!r[1]).map(r=>r[0]);
  const vals=feas.slice();
  for(let i=vals.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));
    const t=vals[i];vals[i]=vals[j];vals[j]=t;}
  const deadv=[];for(let q=tgt.lo;q<=tgt.hi;q++)if(vals.indexOf(q)<0)deadv.push(q);
  const known=VDATA[vkey(L.short,+document.getElementById('tsel').value)];
  // exh() knows one matching rule: rank adjacency on a single value. A wild slot is legal
  // whatever the head is, and a double slot is legal on either of two ranks - so on a level
  // carrying either, the prover would be proving a game nobody plays. That is exactly the
  // defect already recorded for plus tiles. Until exh() models them, decline: a level with
  // no proof makes no promise, which is strictly better than a promise that is not true.
  const bends=(WILDS.size>0||DBLS.size>0||LOCKS.size>0||KEYS.size>0||UDN>0);
  const plan=(FORCELIVE||bends)?FORCEPLAN:((known&&known.d==='L')?LIVEPLAN:PLAN);
  BUILDING={tgt:tgt,vals:vals,deadv:deadv,out:null,sd:0,usedMode:0,stage:0,plan:plan,cached:!!known};
  setBusy(plan[0].msg);

}
function searchPass(mode,ms){
  const B=BUILDING,vals=B.vals;
  if(!vals.length)return;
  const start=Date.now(),per=ms/vals.length;
  let vi=0;
  for(const cand of vals){
    const cEnd=start+per*(++vi);
    if(B.out)break;
    // Collect several PROVED candidates for this target value and ship the best paced one.
    // Bounded three ways: PACE.K proofs, PACE.extraMs after the FIRST proof, and the
    // per-value slice that already existed. The search up to the first proof is identical
    // to before, so a level that proves once behaves exactly as it did.
    const pool=[];let pEnd=0;
    const done=function(){return pool.length>=PACE.K||(pEnd>0&&Date.now()>=pEnd);};
    for(let rd=0;rd<300&&!done()&&Date.now()<cEnd;rd++){
      B.sd=(rnd()*1e9)|0;let s=B.sd;
      const rng=function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
        t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
      for(let a=0;a<1500&&!done();a++){
        const g=gen(B.tgt,cand,rng,mode);if(!g)continue;
        const v=exh(g.rank,g.deck,g.seed,B.tgt.win,cand,g.needPay);
        if(!v){fail('verify');continue;}
        g.ver=v;g.tgt=B.tgt;g.tv=cand;g.sd=B.sd;g.pace=paceScore(g);
        pool.push(g);
        if(pEnd===0)pEnd=Date.now()+PACE.extraMs;}}
    // The latch. Anything proved ships. This line is the whole coverage guarantee: the
    // scorer chooses AMONG proofs and can never reject the only one.
    if(pool.length){B.out=pickBest(pool);B.out.poolN=pool.length;B.usedMode=mode;}
    if(!B.out&&mode===3&&B.deadv.indexOf(cand)<0)B.deadv.push(cand);}
}
function buildTick(){
  const B=BUILDING;if(!B)return;
  if(B.out||B.stage>=B.plan.length){finishBuild();return;}
  const st=B.plan[B.stage];
  if(st.live){
    for(const cand of B.vals){
      if(B.out)break;
      for(let a=0;a<40&&!B.out;a++){const g=genLive(B.tgt,cand);
        if(g){g.tv=cand;B.out=g;B.usedMode=4;}}}
  }else{
    searchPass(st.m,st.ms);
    if(B.out)B.usedMode=st.m;

  if(!B.out&&B.stage<B.plan.length)setBusy(B.plan[B.stage].msg);
  sched(buildTick);
}

function plusFire(i){

  scrollAdvance();
  PLUSFIRED.push(i);
  const before=deckLeft();
  const added=[];
  // Cards land on TOP of the deck, so they are drawn next, in reverse order of emission.
  // dk[di] is next here, so they splice in at di.
  for(let g=0;g<val;g++){
    const r=supplyPick();
    if(r===undefined)break;
    const L2=supplyLabel(r);
    dk.splice(di,0,[L2[0]+L2[1],r,L2[2],true]);   // [3]: granted, not core supply
