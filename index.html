// ---- rescue sweep ------------------------------------------------------------
// Plays every level down to its dead state and buys rescues like a persistent player,
// so the tuning can be read off measured behaviour instead of guessed. The line that
// matters is predicted against actual: if the ladder does not track its own numbers,
// no amount of moving the sliders means anything.
let ECS=null,ECSLAST=null;
function ecSweepStart(){
  if(ECS||BUILDING||BOT||BATCH)return;
  const passes=+document.getElementById('ecruns').value;
  ECS={li:0,ti:0,pass:0,passes:passes,done:0,
       total:LEVELS.length*2*passes,t0:Date.now(),stop:false,
       rows:[],rung:{},boards:0,rescues:0,wins:0,cards:0,dead:0,
       pointless:0,cleared:0,tries:{},modes:{},withheld:0,
       keepL:+document.getElementById('lsel').value,
       keepT:+document.getElementById('tsel').value};
  document.getElementById('ecbox').style.display='';
  document.getElementById('ecsweepbtns').style.display='none';
  ecSweepStep();
}
function ecSweepStop(){if(ECS)ECS.stop=true;}
function ecSweepOne(li,ti,pass){
  const S=ECS,short=LEVELS[li].short;
  const row={level:short,outcome:OUT[ti].n,pass:pass+1,stranded:0,
             tries:0,won:0,cards:0,dead:0,cleared:0,modes:[],intents:[]};
  document.getElementById('tsel').value=String(ti);
  useLevel(li);srand(seedFor(short,ti)+pass*104729);
  SILENT=true;SYNCB=true;LV=null;BUILDING=null;
  try{build();}catch(e){SILENT=false;SYNCB=false;return row;}
  SILENT=false;SYNCB=false;
  if(!LV)return row;
  srand(7919+pass*31+li*13+ti);SILENT=true;skipToEnd();SILENT=false;
  const left0=N-cl.size;
  if(left0===0)return row;
  row.stranded=left0;S.boards++;
  let t=0;
  while(N-cl.size>0&&t<6){
    if(!ecCanDoAnything()){S.withheld++;break;}
    const n=(t%2===0)?3:5;
    SILENT=true;ecStart(n,n===3?'ad':'coins');
    if(!EC){SILENT=false;break;}
    const rung=EC.run,pred=EC.chance,mode=EC.mode,intent=EC.intent;
    skipToEnd();SILENT=false;
    t++;S.rescues++;
    const dealt=EC.story.length,cleared=EC.cleared;
    const won=(N-cl.size===0);
    S.cards+=dealt;S.cleared+=cleared;
    S.dead+=EC.story.filter(function(s){return s.cleared===0;}).length;
    if(cleared===0)S.pointless++;
    if(won)S.wins++;
    S.modes[mode]=(S.modes[mode]||0)+1;
    const R=S.rung[rung]=S.rung[rung]||{n:0,w:0,pred:0};
    R.n++;R.pred+=pred;if(won)R.w++;
    row.tries++;row.cards+=dealt;row.dead+=EC.story.filter(function(s){return s.cleared===0;}).length;
    row.cleared+=cleared;row.modes.push(mode);row.intents.push(intent);
    if(won){row.won=1;break;}
  }
  S.tries[row.tries]=(S.tries[row.tries]||0)+1;
  return row;
}
function ecSweepStep(){
  const S=ECS;if(!S)return;
  if(S.stop||S.pass>=S.passes){ecSweepFinish();return;}
  const t0=Date.now();
  while(Date.now()-t0<320&&S.pass<S.passes&&!S.stop){
    S.rows.push(ecSweepOne(S.li,S.ti===0?3:4,S.pass));
    S.done++;S.ti++;
    if(S.ti>=2){S.ti=0;S.li++;
      if(S.li>=LEVELS.length){S.li=0;S.pass++;}}
  }
  ecSweepProgress(false);
  setTimeout(ecSweepStep,0);
}
function ecSweepProgress(done){
  const S=ECS||ECSLAST;if(!S)return;
  const pct=Math.round(100*S.done/S.total),el=Date.now()-S.t0;
  const eta=S.done?Math.round((el/S.done)*(S.total-S.done)/1000):0;
  document.getElementById('ecbar').style.width=pct+'%';
  const wr=S.rescues?Math.round(100*S.wins/S.rescues):0;
  document.getElementById('ectxt').innerHTML=(done?'<b>Finished.</b> ':'')+
    S.boards+' dead boards \u00b7 '+S.rescues+' rescues \u00b7 '+
    '<b style="color:#059669">'+wr+'% cleared</b> \u00b7 '+
    (S.cards?Math.round(100*S.dead/S.cards):0)+'% dead cards \u00b7 '+
    '<b style="color:'+(S.pointless?'#dc2626':'#059669')+'">'+S.pointless+
    ' pointless</b>'+
    (done?' \u00b7 took '+Math.round(el/1000)+'s':' \u00b7 about '+eta+'s left');
  if(!done)return;
  let h='<p style="font-size:11px;color:#6b7280;margin-bottom:6px">'+
    '<b>Ladder \u2014 does it track its own numbers?</b></p>';
  Object.keys(S.rung).sort(function(a,b){return a-b;}).forEach(function(k){
    const R=S.rung[k],p=Math.round(R.pred/R.n),a=Math.round(100*R.w/R.n);
    const gap=Math.abs(p-a);
    h+='<span class="chip '+(gap<=12?'draw':'miss')+'">try '+k+' \u00b7 n'+R.n+
      ' \u00b7 aimed '+p+'% \u00b7 got '+a+'%</span> ';});
  h+='<p style="font-size:11px;color:#6b7280;margin:8px 0 5px"><b>Rescues needed to clear</b></p>';
  Object.keys(S.tries).sort(function(a,b){return a-b;}).forEach(function(k){
    h+='<span class="chip">'+(k==='0'?'never offered':k+(k==='1'?' rescue':' rescues'))+
      ' \u00b7 '+S.tries[k]+'</span> ';});
  h+='<p style="font-size:11px;color:#6b7280;margin:8px 0 5px"><b>Experience spread</b></p>';
  Object.keys(S.modes).forEach(function(k){
    const m=EC_MODES.filter(function(x){return x.id===k;})[0];
    h+='<span class="chip">'+(m?m.n:k)+' \u00b7 '+S.modes[k]+'</span> ';});
  h+='<p style="font-size:11px;color:#6b7280;margin-top:8px">Average '+
    (S.rescues?(S.cleared/S.rescues).toFixed(1):0)+' cards cleared per rescue, '+
    (S.rescues?(S.cards/S.rescues).toFixed(1):0)+' cards dealt. '+
    S.withheld+' offers withheld as useless.</p>';
  document.getElementById('eclist').innerHTML=h;
}
function ecSweepFinish(){
  ECSLAST=ECS;ecSweepProgress(true);
  const S=ECS;ECS=null;
  document.getElementById('ecsweepbtns').style.display='';
  document.getElementById('lsel').value=String(S.keepL);
  document.getElementById('tsel').value=String(S.keepT);
  useLevel(S.keepL);build();
}
function ecSweepClear(){ECS=null;ECSLAST=null;
  document.getElementById('ecbox').style.display='none';
  document.getElementById('ecbar').style.width='0';
  document.getElementById('ectxt').innerHTML='';
  document.getElementById('eclist').innerHTML='';}
function ecSweepCSV(){
  const S=ECSLAST;if(!S)return;
  const cols=['Level','Core outcome','Pass','Cards stranded at loss','Rescues bought',
    'Cleared the board','Cards dealt','Cards that matched nothing','Tableau cards cleared',
    'Experience modes used','What each rescue aimed at'];
  const q=function(v){return '"'+String(v).replace(/"/g,'""')+'"';};
  const lines=[cols.map(q).join(',')];
  S.rows.forEach(function(r){
    lines.push([r.level,r.outcome,r.pass,r.stranded,r.tries,r.won?'yes':'no',
      r.cards,r.dead,r.cleared,r.modes.join(' '),r.intents.join(' ')].map(q).join(','));});
  lines.push([]);
  lines.push(['Tuning','base','inc','cap','adAdj','band'].map(q).join(','));
  lines.push(['',EC_TUNE.base,EC_TUNE.inc,EC_TUNE.cap,EC_TUNE.adAdj,EC_TUNE.band].map(q).join(','));
  lines.push([]);
  lines.push(['Rung','Rescues','Aimed at %','Actually cleared %'].map(q).join(','));
  Object.keys(S.rung).sort(function(a,b){return a-b;}).forEach(function(k){
    const R=S.rung[k];
    lines.push([k,R.n,Math.round(R.pred/R.n),Math.round(100*R.w/R.n)].map(q).join(','));});
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tripeaks-rescue-sweep.csv';document.body.appendChild(a);a.click();
  document.body.removeChild(a);
}

// play the level out automatically, so the out-of-cards state can be reached without
// clearing the board by hand every time
function skipToEnd(){
  if(!LV)return;
  SILENT=true;
  let g=0;
  while(g++<800){
    const lg=legals();
    if(N-cl.size===0)break;
    // A ready pair is free, so take it first. lkTap spends no rnd(), so preferring it
    // does not shift the level's random stream.
    if(lkReady())lkTap(lkFirst(KEYS));
    else if(lg.length)play(lg[Math.floor(rnd()*lg.length)]);
    else if(deckLeft()>0)draw();
    else break;
  }
  SILENT=false;
  act='Skipped to the end';
  beat=(N-cl.size===0)?'Payoff':'Stall';
  render();
}
function mainAct(){const lg=legals();
  if(lg.length===1)play(lg[0]);
  else if(lg.length===0){if(lkReady())lkTap(lkFirst(KEYS));else draw();}}
function reset(){if(!LV)return;
  // put the level back exactly as it was built: a re-plan belongs to one round only
  if(LV.base){
    if(LV.base.rank){const r={};for(let i=0;i<N;i++)r[i]=LV.base.rank[i];LV.rank=r;}
    if(LV.base.LB)LV.LB=LV.base.LB.slice();
    if(LV.base.deck)LV.deck=LV.base.deck.slice();
    if(LV.base.pool)LV.pool=Object.assign({},LV.base.pool);
    if(LV.base.usd)LV.usd=Object.assign({},LV.base.usd);
  }
  ecReset(false);SUPPLY_LOG=[];STREAK_LOG=[];stkReset();PLUSFIRED=[];LKDONE=[];
  STREAK_GRANTED=0;STREAK_REWARDS=0;COINS=0;
  cl=new Set();wl=LV.seedCard;wr=LV.seed;di=0;k=0;log=[];stack=[];
  CHAINMAX=0;DENIALS=0;DENKEY=-1;
  wild=false;wx=0;py=0;dk=LV.deck.slice();miss=0;rep=0;replans=0;health='Target intact.';
  LV.liveDeck=false;
  scrollInit();
  if(LV.live){dk=[];RUNLEFT=dRunLen();}else RUNLEFT=0;
  // A tile with no blockers fires at the deal, and it must fire AFTER the round state is
  // rebuilt. plusFire splices into dk and writes LV.deck back, so firing while dk is still
  // the previous round's array deals from a corrupted deck - and the absorb result it
  // records would then be overwritten by the reset that followed it. Latent today: every
  // authored tile has blockers, and parseLevel warns when one does not.
  if(typeof plusSweep==='function'&&LV&&PLUS)plusSweep();
  beat='Opening';act='Level start';
  note='The waste opens on '+LV.seedCard[0]+LV.seedCard[1]+'.';render();}
function kpi(c,ico,lbl,val,sub){return '<div class="kpi" style="--c:'+c+'"><div class="kpi-icon">'+ico+
  '</div><div class="kpi-lbl">'+lbl+'</div><div class="kpi-val">'+val+'</div>'+
  (sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';}

function render(){
  if(SILENT)return;
  const B=document.getElementById('board');
  if(!LV){B.innerHTML='';document.getElementById('kpis').innerHTML='';
    ['ecov','ecpanel','stkpanel'].forEach(function(x){const e=document.getElementById(x);if(e)e.innerHTML='';});
    ['acts1','acts2','log','pips','deck','waste','wildbox','tgs'].forEach(x=>document.getElementById(x).innerHTML='');
    document.getElementById('beatp').style.display='none';return;}
  document.getElementById('beatp').style.display='';
  if(!fitBoard()){setTimeout(render,50);return;}
  // Counted after any plus sweep, because a plus tile clears itself without a match. If
  // the win check ran only on a match, a board whose last tile is a plus card would empty
  // and raise nothing - the gap section 14 of the obstacle doc measures.
  const left=N-cl.size,dkn=deckLeft(),lg=legals();
  // A ready pair is a real move that costs no draw, so it has to count here. Without it
  // the demo would call a loss while the player still holds a free two-card clear.
  const rdy=lkReady();
  const won=left===0,lost=!won&&dkn===0&&lg.length===0&&!rdy&&!wild,mt=k%PIPS;
  const den=!won&&!lost&&!wild&&lg.length===0&&!rdy&&mt===PIPS-1&&left>0;
  // den is a state, recomputed on every paint - it says a denial is happening, not that
  // one happened. Counting needs the edge into it, once per move: log.length names the
  // move this paint describes, so a re-render during the same denial cannot recount it,
  // and undo restores both numbers from the snapshot. LV.ver.minDen is a different thing
  // entirely - the proved floor over every line, not what this round actually did.
  if(den&&DENKEY!==log.length){DENIALS++;DENKEY=log.length;}
  // Dead draws straight off the log - every draw already records whether anything was
  // legal before it. The longest run ends at any entry that is not itself a dead draw.
  let deadN=0,deadRun=0,dcur=0;
  for(const e of log){
    if(e.t==='d'&&e.dead){deadN++;dcur++;if(dcur>deadRun)deadRun=dcur;}
    else dcur=0;}
  const AV=avail();
  // Extra cards by source rather than 'over N grants': the three systems that grant cards
  // are different facts about the round - a plus tile is authored, a streak reward is
  // earned, a rescue card means the player was losing - and one number would hide which.
  const exCards=plusGranted()+STREAK_GRANTED+ECGRANTED;
  const outBand=(LV.band?(LV.band[0]+'\u2013'+LV.band[1]):('exactly '+LV.tv))+
    (LV.tgt.win?' draws unused':' cards unreachable');
  document.getElementById('kpis').innerHTML=
    kpi('#3b5bdb','CARD','Cards left',left,left+' of '+N+' \u00b7 best chain '+CHAINMAX)+
    kpi('#7c3aed','DECK','Deck left',dkn,
      (LV.band?('aim '+LV.band[0]+'\u2013'+LV.band[1]+' unused'):('target '+LV.tv+' unused'))+
      ' \u00b7 '+deadN+' dead draw'+(deadN===1?'':'s'))+
    '<div class="kpi" style="--c:#0891b2"><div class="kpi-icon">PLAN</div>'+
      '<div class="kpi-lbl">Target outcome</div>'+
      '<div class="kpi-out">'+LV.tgt.n+'</div>'+
      '<div class="kpi-band">'+outBand+'</div>'+
      '<div class="kpi-dir '+(LV.live?'live':'ver')+'">'+(LV.live?'LIVE DIRECTOR':'VERIFIED')+'</div></div>'+
    kpi('#059669','STREAK','Streaks made',py,
      DENIALS+' denial'+(DENIALS===1?'':'s')+' \u00b7 floor \u2265'+LV.ver.minPay)+
    kpi('#dc2626','MISTAKE','Mistakes',miss,'longest dead run '+deadRun)+
    kpi('#f59e0b','EXTRA CARDS','Extra cards',exCards,
      plusGranted()+' plus \u00b7 '+STREAK_GRANTED+' streak \u00b7 '+ECGRANTED+' rescue');
  document.getElementById('bsub').textContent=L.name+' \u00b7 '+ROOTS+' face-up';
  let h='';
  if(TG.lines){
    const hw=CW/2,hh=CH/2;
    const edgePt=(cx,cy,dx,dy)=>{
      const t=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);
      return [cx+dx*t,cy+dy*t];};
    let halo='',core='';
    for(let n=0;n<N;n++){if(cl.has(n))continue;
      for(const b of(DEP[n]||[])){if(cl.has(b)||!expo(b))continue;
        const ax=lx(b)+hw,ay=ty(b)+hh,bx=lx(n)+hw,by=ty(n)+hh;
        const dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy);
        if(len<1)continue;
        const s=edgePt(ax,ay,dx,dy);
        const sp=Math.min(len*0.55,Math.max(18,CW*0.46));
        const ex=(s[0]+dx/len*sp).toFixed(1),ey=(s[1]+dy/len*sp).toFixed(1);
        const sx=s[0].toFixed(1),sy=s[1].toFixed(1);
        halo+='<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+
          '" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity="0.95"/>';
        core+='<line x1="'+sx+'" y1="'+sy+'" x2="'+ex+'" y2="'+ey+
          '" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.85"/>'+
          '<circle cx="'+ex+'" cy="'+ey+'" r="3" fill="#4b5563" opacity="0.85"/>';}}
    if(core)h+='<svg width="'+BWp+'" height="'+BHp+
      '" style="position:absolute;left:0;top:0;z-index:200;pointer-events:none" aria-hidden="true">'+
      halo+core+'</svg>';}
  for(let i=0;i<N;i++){
    const g=cl.has(i),e=expo(i),pl=lg.indexOf(i)>=0,pick=pl;
    const show=e||TG.reveal||isWildSlot(i);   // a wild is face-up from the deal, always
    let cls='pc'+(g?' gh':pl?(' pl'+(pick?' clk':'')):show?'':' dn');
    const zi=g?1:(pl?400:(10+(100-DPT[i])));
    // A double value card renders 1.35x, grown about its own centre so it still sits on
    // its slot - the extra chip is what makes it identifiable at a glance, and the 0.175
    // half-overhang is the same figure the shipping build subtracts from the scroll clamp.
    const dz=isDblSlot(i)&&!cl.has(i), dw=dz?CW*1.35:CW, dh=dz?CH*1.35:CH;
    let st='left:'+(lx(i)-(dw-CW)/2)+'px;top:'+(ty(i)-(dh-CH)/2)+'px;width:'+dw+'px;height:'+dh+
      'px;z-index:'+(dz?(zi+50):zi)+';transform:rotate('+ROT[i]+'deg);font-size:'+
      Math.max(10,Math.round(dw*0.29))+'px;';
    if(!g&&!e&&TG.fade)st+='opacity:'+[1,1,.72,.52,.36][Math.min(AV[i],4)]+';';
    let body='';
    if(g)body='';
    else if(isPlusCard(i)){
      const v=plusValue(i);
      const small=CW<46;   // caption stops being legible below this
      body='<span class="plusb"><span class="pv" style="font-size:'+
        Math.max(13,Math.round(CW*0.38))+'px">+'+v+'</span>'+
        (small?'':'<span class="pl">PLUS<br>CARD</span>')+'</span>';
      cls+=' plusc';}
    else if(isUDSlot(i)&&show&&LV.rank[i]!==undefined){
      // Ordinary card face, ordinary border - it is an ordinary card. The window shows the
      // rank it is leaving, the rank it is worth now, and the rank it moves to next.
      const r=LV.rank[i],st=UPDN[i],L=LV.LB[i];
      // Ghost above is the rank it is leaving, ghost below is the rank it steps to next -
      // so the column always reads forward downward, and up and down are told apart at the
      // same rank and the same suit by the order of the ghosts as well as by the arrow.
      body='<span class="udb">'+
        '<span class="sy">'+(L?L[1]:'')+'</span>'+
        '<span class="gh">'+RN[udWrap(r-st)]+'</span>'+
        '<span class="rk">'+RN[r]+
          '<span class="ar">'+(st>0?'\u25b2':'\u25bc')+'</span></span>'+
        '<span class="gh">'+RN[udWrap(r+st)]+'</span></span>';
      cls+=' udc'+((L&&L[2])?' red':'')+(UDFLASH.has(i)?' udf':'');
      if(e&&unl(i)>0)body+='<span class="bdg">+'+unl(i)+'</span>';}
    else if(isLKSlot(i)&&show){
      // A COVERED lock or key is indistinguishable from an ordinary face-down card - no
      // badge, no marker. That is deliberate in the shipping build: the player cannot see
      // the gate coming, and cannot plan around it, until the tile flips. So this branch
      // is gated on `show` and a covered tile falls through to the face-down painter.
      const isk=isKeySlot(i);
      body='<span class="lkb'+(SHAKE===i?' shk':'')+'">'+(isk?LKSVG.key:LKSVG.lock)+
        '<span class="cap">'+(isk?'KEY':'LOCKED')+'</span></span>';
      cls+=' lkc';
      if(e&&onScreen(i)){if(lkReady()){if(isk)cls+=' lkrdy';}else cls+=' lkno';}
      if(e&&unl(i)>0)body+='<span class="bdg">+'+unl(i)+'</span>';}
    else if(isWildSlot(i)){
      body='<span class="wildb'+(SHAKE===i?' shk':'')+'">'+
        '<span class="wl">WILD</span></span>';
      cls+=' wildc';
      if(!pl&&e&&onScreen(i))cls+=' wildno';
      if(e&&unl(i)>0)body+='<span class="bdg">+'+unl(i)+'</span>';}
    else if(isDblSlot(i)&&LV.rank[i]!==undefined){
      // Two ranks stacked, high value on top, divided by a rule - each row is a whole card.
      // The pips are the COLOUR-FAMILY PAIR: spade with club, diamond with heart, matching
      // the shipping sprites Card_Spade&-Club and Card_Diamond&Heart. The same suit twice
      // would be a card that cannot exist.
      const red=!!LV.LB[i][2], p=red?['♦','♥']:['♠','♣'];
      body='<span class="dblb">'+
        '<span class="rk">'+RN[secondOf(LV.rank[i])]+'</span>'+
        '<span class="rule"></span>'+
        '<span class="rk">'+RN[LV.rank[i]]+'</span>'+
        '<span class="su">'+p[0]+'<br>'+p[1]+'</span></span>';
      cls+=' dblc'+(red?' red':'');
      if(e&&unl(i)>0)body+='<span class="bdg">+'+unl(i)+'</span>';}
    else if(show){body='<span'+(LV.LB[i][2]?' class="red"':'')+'><span class="rk">'+LV.LB[i][0]+
      '</span><span class="sy">'+LV.LB[i][1]+'</span></span>';
      if(e&&unl(i)>0)body+='<span class="bdg">+'+unl(i)+'</span>';}
    else body=TG.count?'<span style="font-size:10px;color:#9ca3af">'+bleft(i)+'</span>'
      :'<span style="width:5px;height:5px;border-radius:50%;background:#c9ccd6;display:block"></span>';
    const refuse=isWildSlot(i)&&!g&&e&&onScreen(i)&&!pick;
    // A revealed half is always tappable, ready or not - an unready tap explains itself.
    const lktap=isLKSlot(i)&&!g&&e&&onScreen(i);
    h+='<div class="'+cls+'"'+(pick?' onclick="play('+i+')"':
      (lktap?' onclick="lkTap('+i+')"':
      (refuse?' onclick="wildRefused('+i+')"':'')))+' style="'+st+'">'+body+'</div>';}
  B.innerHTML=h;
  let ph='';
  for(let i=0;i<PIPS;i++){
    const c=STK.cards[i];
    let cls='pip';
    if(i<mt&&c)cls+=' '+(c.wild?'wildp':(c.red?'red':'black'));
    else if(i<mt)cls+=' on';
    ph+='<div class="'+cls+'" title="'+(c?c.label:'')+'"></div>';}
  document.getElementById('pips').innerHTML=ph;
  document.getElementById('mnum').textContent=mt+'/'+PIPS;
  const pend=stkPending();
  const x2=document.getElementById('mx2');
  if(x2){
    const on=(pend.applied&&STK.n>0);   // only claim a bonus that actually pays
    x2.style.display=on?'':'none';
    if(on){
      const col=(STK.color==='RED')?'red':'black';
      // re-trigger the pop only when it first turns on or the colour changes
      if(x2.className!=='mx2 '+col){x2.className='mx2 '+col;}
      x2.textContent='\u00d7'+pend.mult;
      x2.title='Every card '+STK.color.toLowerCase()+' so far \u2014 the reward is '+
        '\u00d7'+pend.mult+' if the streak finishes on one colour.';
    }
  }
  const mp=document.getElementById('mpay');
  mp.textContent=pend.label;
  mp.title=pend.applied?('\u00d7'+pend.mult+' from the same-colour streak'):
    (pend.colorMult>1&&!pend.scales?
      ('Completing the streak pays '+pend.label+'. A wild reward does not scale with colour.'):
      ('Completing the streak pays '+pend.label));
  document.getElementById('bsub').textContent=L.short;
  const nm={lines:'Links',count:'Counts',fade:'Depth',reveal:'Reveal'};
  document.getElementById('tgs').innerHTML=['lines','count','fade','reveal'].map(x=>
    '<span class="tg'+(TG[x]?' on':'')+'" onclick="tog(\''+x+'\')">'+nm[x]+'</span>').join('');
  document.getElementById('deck').innerHTML=
    (dkn>1?'<div class="stk" style="left:4px;top:4px"></div>':'')+
    (dkn>0?'<div class="stk" style="left:2px;top:2px"></div>':'')+
    '<div class="face"><span class="fnum">'+dkn+'</span><span class="flbl">LEFT</span></div>';
  document.getElementById('waste').innerHTML=(wild||wr===WILD_RANK)
    ?'<div class="face wildon">WILD</div>'
    :'<div class="face wrank'+(wl[2]?' red':'')+'"><span class="rk">'+wl[0]+
      '</span><span class="sy">'+wl[1]+'</span></div>';
  const canWild=!won&&!lost&&!wild&&left>0;
  document.getElementById('wildbox').innerHTML=
    '<div class="face wildf'+(canWild?'':' off')+'"'+(canWild?' onclick="useWild()"':'')+'>'+
    '<span class="wl1">USE</span><span class="wl1">WILD</span>'+
    '<span class="wused">'+wx+' used</span></div>';
  const pe=document.getElementById('pill');
  pe.textContent=won?'Complete':lost?'Stall':den?'Streak denial':(lg.length>=2&&!wild?'Choice':beat);
  pe.className='pill'+(won?' good':(den||beat==='Mistake'?' dang':(beat==='Dry'?' warn':'')));
  document.getElementById('act').textContent=act;
  document.getElementById('need').textContent=(won||lost)?''
    :(wild?'Wild \u2014 anything plays':('Needs '+RN[wr===1?13:wr-1]+' or '+RN[wr===13?1:wr+1]));
  let nt=note;
  if(won)nt='Board clear \u2014 '+dkn+' unused against a target of '+LV.tv+'. '+py+' payout'+
    (py===1?'':'s')+', '+miss+' mistake'+(miss===1?'':'s')+', '+rep+' repaired.';
  else if(lost)nt='Deck empty and nothing is legal \u2014 '+left+' card'+(left===1?'':'s')+
    ' unreachable against a target of '+LV.tv+'.';
  else if(den)nt='Meter at '+mt+' of '+PIPS+' and nothing is legal. Spend a Wild to finish it, or draw and lose it.';
  else if(lg.length>=2&&!wild)nt='More than one card is legal \u2014 every branch still ends exactly as targeted.';
  document.getElementById('note').textContent=nt;
  document.getElementById('health').textContent=(won||lost)?'':health;
  let a1='',a2='';
  if(!won&&!lost){
    if(lg.length>=2&&!wild){
      a1+=lg.map(function(i){
        // A wild slot has no label - it has no rank either, that is the category. It is also
        // the one card that always plays, so the button says that instead of a rank.
        const L0=LV.LB[i];
        const inner=isWildSlot(i)
          ?'<span class="wgold"><span class="sy">WILD</span></span>'
          :('<span'+(L0&&L0[2]?' class="red"':'')+'><span class="rk">'+(L0?L0[0]:'?')+
            '</span><span class="sy">'+(L0?L0[1]:'')+'</span></span>');
        return '<button onclick="play('+i+')">'+inner+
          (isWildSlot(i)?' · matches anything':(' · unblocks '+unl(i)))+'</button>';
      }).join('');
    }else if(!wild){
      a1+='<button class="pri" onclick="mainAct()">'+
        (lg.length===1?'Next move':'Draw a card')+'</button>';}
    if(!wild&&lg.length>0&&dkn>0)a1+='<button class="mis" onclick="miss1()">Draw anyway</button>';}
  a2+='<button onclick="back()"'+(stack.length?'':' disabled')+'>Back</button>';
  if(!won&&!lost)a2+='<button onclick="skipToEnd()">Skip to end</button>';
  a2+='<button onclick="reset()">Replay</button>';
  document.getElementById('acts1').innerHTML=a1;
  document.getElementById('acts2').innerHTML=a2;
  document.getElementById('movetag').textContent='Move '+log.length;
  const dt=document.getElementById('dirtag');
  dt.textContent=DIRSHORT[LV.usedMode||0];
  dt.className='dirtag'+((LV.usedMode||0)===4?' live':'');
  const sc=document.getElementById('scrolltag');
  if(SCROLL){let c=0;for(let i=0;i<N;i++)if(!cl.has(i)&&onScreen(i))c++;
    sc.style.display='';
    sc.textContent=VGATE?('scrolling \u00b7 '+c+' in view'):'all cards in view';}
  else sc.style.display='none';
  if(won)PHASE='won';
  else if(lost)PHASE=(EC&&EC.used>0)?'rescueExpired':'coreLost';
  if(EC&&EC.used>0&&(won||(lost&&EC.rem===0)))ecEmit();
  else if(EC&&EC.rem>0)PHASE='rescuePlaying';
  ecOverlay(won,lost,left);
  ecRenderPanel();
  stkRenderPanel();
  document.getElementById('log').innerHTML=log.map(e=>
    e.t==='p'?'<span class="chip">'+e.s+'</span>'
   :e.t==='w'?'<span class="chip wild">WILD</span>'
   :e.t==='k'?'<span class="chip lk">PAIR</span>'
   :e.t==='m'?'<span class="chip miss">\u2717 '+e.s+'</span>'
   :'<span class="chip '+(e.dead?'dead':'draw')+'">\u21ba '+e.s+'</span>').join('');
}

const BUILTIN=LEVELS.slice();
function status(msg,err){const e=document.getElementById('loadmsg');
  e.className='loadmsg'+(err?' err':'');e.innerHTML=msg;}
function parseLevel(nm,raw){
  const d=(raw&&raw.data)?raw.data:raw;
  const N=d.NumOfCards;
  if(!N||!d.CardPosition||d.CardPosition.length<N)throw new Error('missing NumOfCards or CardPosition');
  const warn=[];
  if(d.CardPosition.length!==N)warn.push('CardPosition has '+d.CardPosition.length+' entries for '+N+' cards');
  if(d.CardRotation&&d.CardRotation.length!==N)warn.push('CardRotation has '+d.CardRotation.length+' entries for '+N+' cards');
  const pos=[];
  for(let i=0;i<N;i++){
    const mm=String(d.CardPosition[i]).match(/-?[0-9.]+/g);
    if(!mm||mm.length<2)throw new Error('bad CardPosition at index '+i);
    pos.push([parseFloat(mm[0]),parseFloat(mm[1])]);}
  const rot=[];
  for(let i=0;i<N;i++){
    let r=Number((d.CardRotation&&d.CardRotation[i])||0);
    if(!isFinite(r))r=0;
    r=((r%360)+360)%360; if(r>180)r-=360;
    rot.push(Math.round(r));}
  const dep={},seenIdx={};for(let i=0;i<N;i++)dep[i]=[];
  for(const e of (d.DependedOn||[])){
    if(typeof e.index!=='number'||e.index<0||e.index>=N){
      warn.push('DependedOn index '+e.index+' is outside 0\u2013'+(N-1));continue;}
    if(seenIdx[e.index])warn.push('duplicate DependedOn entry for index '+e.index);
    seenIdx[e.index]=1;
    const raw2=e.depend||[];
    const bad=raw2.filter(x=>typeof x!=='number'||x<0||x>=N);
    if(bad.length)warn.push('index '+e.index+' depends on out-of-range '+JSON.stringify(bad));
    if(raw2.indexOf(e.index)>=0)warn.push('index '+e.index+' depends on itself');
    dep[e.index]=raw2.filter(x=>typeof x==='number'&&x>=0&&x<N&&x!==e.index);}
  // Plus Card obstacle: a map tile that is never played. When the last card covering it
  // is cleared it fires by itself - grants Value cards to the TOP of the deck and removes
  // itself from the board for free.
  const plus={};
  for(const e of (d.PlusCards||[])){
    const idx=(typeof e.index==='number')?e.index:undefined;
    const val=(typeof e.Value==='number')?e.Value:undefined;
    if(idx===undefined||val===undefined){
      warn.push('PlusCards entry missing index or Value: '+JSON.stringify(e));continue;}
    if(idx<0||idx>=N){warn.push('PlusCards index '+idx+' is outside 0\u2013'+(N-1));continue;}
    if(val<1||val>9){warn.push('PlusCards index '+idx+' has Value '+val+', expected 1\u20139');continue;}
    if(plus[idx]!==undefined)warn.push('duplicate PlusCards entry for index '+idx);
    plus[idx]=val;}
  // A plus tile with no blockers fires during the opening reveal, before the deck has
  // finished dealing. No authored level does this, but nothing stops one.
  for(const k in plus)if(!(dep[k]||[]).length)
    warn.push('plus card at '+k+' has no blockers and will fire on the opening reveal');
  // Wild and Double Value: the two rule-bending obstacles. Both are bare slot lists in the
  // JSON - no value, no variant, nothing per tile - so unlike PlusCards there is no
  // positional-key trap here. What each one becomes is decided entirely at runtime.
  const slotList=function(key,into){
    for(const e of (d[key]||[])){
      const idx=(typeof e==='number')?e:(typeof e==='object'&&typeof e.index==='number')?e.index:undefined;
      if(idx===undefined){warn.push(key+' entry is not a slot index: '+JSON.stringify(e));continue;}
      if(idx<0||idx>=N){warn.push(key+' index '+idx+' is outside 0–'+(N-1));continue;}
      if(into.indexOf(idx)>=0){warn.push('duplicate '+key+' entry for index '+idx);continue;}
      into.push(idx);}
  };
  const wildc=[],dblc=[];
  slotList('WildCards',wildc);
  slotList('DoubleValueCards',dblc);
  // One slot in two obstacle lists is legal in the format and the shipping deal loop applies
  // every matching setter, last one winning. Six such slots exist across 2,500 levels. We
  // refuse rather than silently pick, because which one wins is an ordering accident.
  for(const i of wildc){
    if(plus[i]!==undefined)warn.push('slot '+i+' is both a Plus Card and a Wild - the plus tile wins and the wild never takes effect');
    if(dblc.indexOf(i)>=0)warn.push('slot '+i+' is both Wild and Double Value - wild is tested first, so the double values are unreachable');}
  for(const i of dblc)if(plus[i]!==undefined)
    warn.push('slot '+i+' is both a Plus Card and a Double Value card');
  // Lock & Key: two tiles that clear each other, never matched, no deck cost. The JSON key
  // is FishCards and the two roles are INVERTED from their names - SharkCard = 1 is the
  // KEY and FishCard = 2 is the LOCK, a leftover from an earlier shark-and-fish theme that
  // the shipping code resolves in exactly one place. Same positional-key trap as PlusCards:
  // the parse takes the first child property as index, so key order is load-bearing.
  const lockc=[],keyc=[];
  for(const e of (d.FishCards||[])){
    const idx=(typeof e.index==='number')?e.index:undefined;
    const val=(typeof e.Value==='number')?e.Value:undefined;
    if(idx===undefined||val===undefined){
      warn.push('FishCards entry missing index or Value: '+JSON.stringify(e));continue;}
    if(idx<0||idx>=N){warn.push('FishCards index '+idx+' is outside 0\u2013'+(N-1));continue;}
    // Value 0 exists in the shipping data exactly once. It is not a member of the enum, the
    // shipping cast is unchecked, and the tile ends up neither key nor lock: it RENDERS as
    // a lock but ACTS as the key, and the artwork visibly swaps at the moment of collection.
    // Refuse it rather than reproduce it - a role that has no name cannot be authored on purpose.
    if(val!==1&&val!==2){
      warn.push('FishCards index '+idx+' has Value '+val+
        ' \u2014 only 1 (key) and 2 (lock) exist, so this tile has no role and is dropped');continue;}
    if(keyc.indexOf(idx)>=0||lockc.indexOf(idx)>=0){
      warn.push('duplicate FishCards entry for index '+idx);continue;}
    (val===1?keyc:lockc).push(idx);}
  if(keyc.length!==lockc.length)
    warn.push('FishCards is unbalanced: '+keyc.length+' key'+(keyc.length===1?'':'s')+
      ' against '+lockc.length+' lock'+(lockc.length===1?'':'s')+
      ' \u2014 the surplus can never be collected and blocks whatever it covers for the whole level');
  // Measured over every lock/key tile in the shipping data: a lock never blocks a key and a
  // key never blocks a lock. That is what stops a pair deadlocking itself, and it is a
  // property of the authored data rather than of the code - so it is worth saying out loud
  // when a level breaks it.
  for(const a of keyc.concat(lockc))for(const b of (dep[a]||[]))
    if(keyc.indexOf(b)>=0||lockc.indexOf(b)>=0)
      warn.push('lock/key tile '+a+' is blocked by lock/key tile '+b+
        ' \u2014 no shipping level does this, and a pair that blocks its own partner can never be collected');
  for(const i of keyc.concat(lockc)){
    if(plus[i]!==undefined)warn.push('slot '+i+' is both a Plus Card and a Lock/Key tile');
    if(wildc.indexOf(i)>=0)warn.push('slot '+i+' is both Wild and a Lock/Key tile');
    if(dblc.indexOf(i)>=0)warn.push('slot '+i+' is both Double Value and a Lock/Key tile');}
  // Up & Down: an ordinary matchable card whose rank steps by one on every player move.
  // Value is arithmetic, not a role id - it is multiplied into the rank - and every one of
  // the shipping entries is exactly +1 or -1. Anything else is refused here: the wrap clamps
  // a single step out of range rather than taking a modulo, so a step of two would silently
  // skip a rank at the King/Ace boundary, and a step of zero is an arrow that never moves.
  const ud={};
  for(const e of (d.IncrementalCards||[])){
    const idx=(typeof e.index==='number')?e.index:undefined;
    const val=(typeof e.Value==='number')?e.Value:undefined;
    if(idx===undefined||val===undefined){
      warn.push('IncrementalCards entry missing index or Value: '+JSON.stringify(e));continue;}
    if(idx<0||idx>=N){warn.push('IncrementalCards index '+idx+' is outside 0\u2013'+(N-1));continue;}
    if(val!==1&&val!==-1){
      warn.push('IncrementalCards index '+idx+' has Value '+val+
        ' \u2014 only +1 (up) and -1 (down) are safe; the rank wrap tolerates one step, so any '+
        'other value skips a rank at the King/Ace boundary');continue;}
    if(ud[idx]!==undefined){warn.push('duplicate IncrementalCards entry for index '+idx);continue;}
    ud[idx]=val;}
  for(const key in ud){const i=+key;
    if(plus[i]!==undefined)warn.push('slot '+i+' is both a Plus Card and an Up/Down card');
    if(wildc.indexOf(i)>=0)warn.push('slot '+i+' is both Wild and Up/Down \u2014 a wild has no rank to step');
    if(dblc.indexOf(i)>=0)warn.push('slot '+i+' is both Double Value and Up/Down');
    if(keyc.indexOf(i)>=0||lockc.indexOf(i)>=0)
      warn.push('slot '+i+' is both Lock/Key and Up/Down \u2014 a lock or key is never matched, '+
        'so a stepping rank on it is invisible and pointless');}
  const deckN=Number(d.NumberOfDeckCards||0);
  // A stripped export may omit IsScrollableLevel. It can be recovered from the rightmost card:
  // a fixed board is centred and tops out near 524, a scrolling one is anchored at -400 and runs
  // to 761 or beyond. The gap is wide and unambiguous. Validated by check-scroll-inference.js.
  let scroll, scrollInferred=false;
  if(d.IsScrollableLevel!==undefined){scroll=Number(d.IsScrollableLevel)===1;}
  else{
    let mx=-Infinity;
    for(const p of pos)if(p[0]>mx)mx=p[0];
    scroll=mx>SCROLL_INFER_X;
    scrollInferred=true;
  }
  if(!d.NumberOfDeckCards)warn.push('NumberOfDeckCards is missing or zero');
  return {name:nm+' \u2014 '+N+' cards, deck '+deckN,short:nm,N:N,deckN:deckN,
          pos:pos,rot:rot,dep:dep,warn:warn,scroll:scroll,scrollInferred:scrollInferred,
          plus:plus,wild:wildc,dbl:dblc,lock:lockc,key:keyc,ud:ud};
}
function natsort(a,b){
  const sa=a.short.replace(/\d+/g,''),sb=b.short.replace(/\d+/g,'');
  if(sa===sb){const na=a.short.match(/\d+/),nb=b.short.match(/\d+/);
    if(na&&nb)return Number(na[0])-Number(nb[0]);}
  return a.short<b.short?-1:(a.short>b.short?1:0);
}
// ==== STYLED DROPDOWNS ========================================================
// Wrap a real <select> in markup we can style. The select is never removed and never stops
// being the source of truth, so every existing read of .value and every write to it keeps
// working untouched - this is a skin, not a replacement.
let DDOPEN=null;
const ddEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');
function ddSync(sel){
  const d=sel.__dd;if(!d)return;
  const cur=sel.value, o=sel.options[sel.selectedIndex];
  d.lab.textContent=o?o.textContent:'';
  let html='';
  for(let i=0;i<sel.options.length;i++){const p=sel.options[i];
    html+='<button type="button" class="ddopt'+(p.value===cur?' sel':'')+
      '" data-v="'+ddEsc(p.value)+'">'+ddEsc(p.textContent)+'</button>';}
  d.menu.innerHTML=html;}
function ddClose(){
  if(!DDOPEN)return;
  DDOPEN.wrap.classList.remove('open');DDOPEN.menu.hidden=true;
  DDOPEN.btn.setAttribute('aria-expanded','false');DDOPEN=null;}
function ddOpen(d){
  ddClose();d.wrap.classList.add('open');d.menu.hidden=false;
  d.btn.setAttribute('aria-expanded','true');DDOPEN=d;
  const s=d.menu.querySelector('.ddopt.sel');if(s)s.scrollIntoView({block:'nearest'});}
function ddInit(id){
  const sel=document.getElementById(id);if(!sel||sel.__dd)return null;
  const wrap=document.createElement('div');wrap.className='dd';
  const btn=document.createElement('button');btn.type='button';btn.className='ddbtn';
  btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');
  if(sel.title)btn.title=sel.title;
  const lab=document.createElement('span');lab.className='ddlab';btn.appendChild(lab);
  const menu=document.createElement('div');menu.className='ddmenu';menu.hidden=true;
  menu.setAttribute('role','listbox');
  wrap.appendChild(btn);wrap.appendChild(menu);
  sel.parentNode.insertBefore(wrap,sel);sel.classList.add('ddhide');
  const d={wrap:wrap,btn:btn,lab:lab,menu:menu,sel:sel};sel.__dd=d;
  // Four separate places in the app assign to .value, and each has to move this label too.
  // Intercepting the property is one place instead of four, and the next thing that writes
  // .value cannot forget to call the sync.
  const desc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(sel,'value',{configurable:true,
    get:function(){return desc.get.call(sel);},
    set:function(v){desc.set.call(sel,v);ddSync(sel);}});
  btn.onclick=function(e){e.stopPropagation();if(DDOPEN===d)ddClose();else ddOpen(d);};
  menu.onclick=function(e){
    const t=e.target.closest('.ddopt');if(!t)return;
    e.stopPropagation();
    sel.value=t.getAttribute('data-v');   // the setter above re-syncs label and rows
    ddClose();
    sel.dispatchEvent(new Event('change'));};
  btn.onkeydown=function(e){
    if(e.key==='ArrowDown'&&DDOPEN!==d){e.preventDefault();ddOpen(d);}
    else if(e.key==='Escape')ddClose();};
  ddSync(sel);return d;}
document.addEventListener('click',ddClose);
document.addEventListener('keydown',function(e){if(e.key==='Escape')ddClose();});
function rebuildSelect(){
  const sel=document.getElementById('lsel');sel.innerHTML='';
  LEVELS.forEach(function(x,i){const o=document.createElement('option');
    o.value=i;o.textContent=x.name;sel.appendChild(o);});
  sel.value='0';
}
function useBuiltin(){
  LEVELS.length=0;BUILTIN.forEach(function(l){LEVELS.push(l);});
  rebuildSelect();status('');useLevel(0);build();
}
function ingest(files){
  files=files.filter(function(f){return /\.json$/i.test(f.name);});
  if(!files.length){status('No .json files found there.',true);return;}
  const out=[],bad=[];let done=0;
  files.forEach(function(f){
    const r=new FileReader();
    r.onload=function(){
      try{out.push(parseLevel(f.name.replace(/\.json$/i,''),JSON.parse(r.result)));}
      catch(err){bad.push(f.name);}
      if(++done===files.length)finish(out,bad);};
    r.onerror=function(){bad.push(f.name);if(++done===files.length)finish(out,bad);};
    r.readAsText(f);});
}
function finish(out,bad){
  if(!out.length){status('Could not parse any of those files.',true);return;}
  out.sort(natsort);
  LEVELS.length=0;out.forEach(function(l){LEVELS.push(l);});
  rebuildSelect();
  status('Loaded '+out.length+' level'+(out.length===1?'':'s')+
    (bad.length?' \u00b7 skipped '+bad.length:'')+
    ' \u00b7 <span class="linkbtn" onclick="useBuiltin()">reset</span>');
  useLevel(0);build();
}
function pickFolder(){
  if(window.showDirectoryPicker){
    window.showDirectoryPicker().then(function(dir){
      const files=[];
      (async function(){
        for await(const hnd of dir.values())
          if(hnd.kind==='file'&&/\.json$/i.test(hnd.name))files.push(await hnd.getFile());
        ingest(files);
      })();
    }).catch(function(e){
      if(e&&e.name==='AbortError')return;
      document.getElementById('filein').click();});
  }else document.getElementById('filein').click();
}
document.addEventListener('dragover',function(e){e.preventDefault();document.body.classList.add('dragging');});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.body.classList.remove('dragging');});
document.addEventListener('drop',function(e){
  e.preventDefault();document.body.classList.remove('dragging');
  const dt=e.dataTransfer;if(!dt)return;
  const items=dt.items;
  if(items&&items.length&&items[0].webkitGetAsEntry){
    const files=[];let pending=0,walked=false;
    const flush=function(){if(walked&&pending===0)ingest(files);};
    const walk=function(entry){
      if(entry.isFile){pending++;entry.file(function(f){files.push(f);pending--;flush();});}
      else if(entry.isDirectory){pending++;
        entry.createReader().readEntries(function(ents){
          ents.forEach(walk);pending--;flush();});}
    };
    for(let i=0;i<items.length;i++){const en=items[i].webkitGetAsEntry();if(en)walk(en);}
    walked=true;flush();
  }else ingest([].slice.call(dt.files));
});
const ls=document.getElementById('lsel');
LEVELS.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;ls.appendChild(o);});
ls.onchange=function(){useLevel(+this.value);build();};
const ts=document.getElementById('tsel');
OUT.forEach((o,i)=>{const e=document.createElement('option');e.value=i;e.textContent=o.n;ts.appendChild(e);});
// After both are populated and before anything assigns .value, so the very first label is
// written by the same path every later one is.
ddInit('lsel');ddInit('tsel');
ts.value=1;ls.value=2;
window.addEventListener('resize',function(){FITTED=false;if(LV)render();});
ecApplyIntensity(0.5);   // the table is the source of truth, not the literals above it
document.getElementById('sd').textContent='v'+APP_VERSION;
renderForceLive();
useLevel(2);build();
</script>
