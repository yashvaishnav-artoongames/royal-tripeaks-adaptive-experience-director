// ==== GAMEPLAY SUPPLY CHANGES ==================================================
// The deck is no longer fixed for the life of a level. Anything - a streak reward, a
// booster, a future mechanic - can add or remove unseen cards. The director's job is to
// absorb that without the player seeing the level change underneath them.
//
// The important part is not the mutation, it is the RETARGET. A win target is expressed
// as "exactly N draws unused", so growing the deck by 2 makes the identical play-out
// land on N+2 without anything about the experience changing. The number has to move
// with the deck or every rung below is measuring the wrong thing.

let SUPPLY_LOG=[];           // one record per supply change, for the debug panel
const SUPPLY_NOTE={
  keep:'The plan still lands from here \u2014 nothing needed changing.',
  adjust:'Re-ordered the cards still to be drawn and re-proved the target from here.',
  replan:'Re-dealt everything unseen \u2014 face-down cards and the rest of the deck \u2014 '+
         'and re-proved the target.',
  reband:'Could not hold the exact number, so the target relaxed to its outcome band '+
         'and was re-proved against that.',
  live:'Nothing the director can still change proves a target from here, so it steers '+
       'the rest live.',
  ec:'The rescue absorbed the new cards and kept its current shape.'};

// What does the outcome mean now that the deck is a different size?
// win  : tv counts DRAWS UNUSED, which scales with the deck
// lose : tv counts UNREACHABLE TABLEAU CARDS, which the deck does not touch - but extra
//        draws can make a stranded board winnable, so the target is at risk, not the number
function retarget(delta){
  if(!LV||!LV.tgt)return {tv:LV?LV.tv:0,moved:0};
  if(!LV.tgt.win)return {tv:LV.tv,moved:0};
  const bd=bandOf(), nv=Math.max(0,LV.tv+delta);
  // only follow the deck while that keeps the outcome honest
  if(nv>=bd[0]&&nv<=bd[1])return {tv:nv,moved:nv-LV.tv};
  return {tv:LV.tv,moved:0};
}
// every value the outcome still permits, nearest the authored one first
function bandOrder(){
  const bd=bandOf(), out=[];
  if(LV.tv>=bd[0]&&LV.tv<=bd[1])out.push(LV.tv);
  for(let d=1;d<=(bd[1]-bd[0]);d++){
    if(LV.tv-d>=bd[0]&&out.indexOf(LV.tv-d)<0)out.push(LV.tv-d);
    if(LV.tv+d<=bd[1]&&out.indexOf(LV.tv+d)<0)out.push(LV.tv+d);
  }
  for(let v=bd[0];v<=bd[1];v++)if(out.indexOf(v)<0)out.push(v);
  return out.length?out:[LV.tv];
}
function bandOf(){
  const t=LV&&LV.tgt?LV.tgt:null;

}
// Try to prove a given tv from where the player actually is, re-ordering only the
// undrawn portion of the deck. Returns the deck that worked, or null.
// Does this rank answer the board as it stands? A snapshot of a board that moves, so it
// is a PREFERENCE and never a gate - D-003 is the record of what happens when a forecast
// like this is trusted as a constraint.
function tailAnswers(r){
  if(r===undefined||r==='')return true;              // a wild answers anything
  for(let i=0;i<N;i++){
    if(cl.has(i)||isPlusCard(i)||!expo(i))continue;
    if(LV.rank[i]===undefined)continue;
    if(cyc(LV.rank[i],r))return true;
  }
  return false;
}
// Reads the undrawn tail the way the player will meet it. The first ordering that lands
// is overwhelmingly a tail of dead draws, and that tail is what reads as padding.
const TAIL={pool:6, extraTries:24, deadRun:3, deadPen:11, earlyBonus:8, earlyWithin:2};
function tailScore(d){
  let s=0,run=0,first=-1;
  for(let p=di;p<d.length;p++){
    const c=d[p];
    if(isWildCard(c)||tailAnswers(c[1])){if(first<0)first=p-di;run=0;}
    else{run++;if(run>=TAIL.deadRun)s-=TAIL.deadPen;}   // EC_RULES.maxDeadRun, for the core deck
  }
  if(first>=0&&first<=TAIL.earlyWithin)s+=TAIL.earlyBonus;

}
function pickBestTail(cands){
  let best=cands[0],bs=tailScore(cands[0]);
  for(let i=1;i<cands.length;i++){const sc=tailScore(cands[i]);if(sc>bs){bs=sc;best=cands[i];}}
  return best;
}
function proveFrom(tv,budgetMs){
  const mk=maskOf(), head=dk.slice(0,di), tail=dk.slice(di);
  if(allHit(mk[0],mk[1],wr,dk,di,LV.tgt.win,tv,LV.rank))return dk;
  const deadline=Date.now()+(budgetMs||300);
  let tries=0;
  // The systematic sweep is deterministic - it consumes no rnd() - so collecting a few
  // orderings here and shipping the best-read one shifts no random stream. It stops a
  // short way past the FIRST ordering that lands, not at the end of the sweep: this runs
  // inside a player's tap, and up to two absorbs can fire on one card, so turning the
  // typical case into the worst case is not affordable.
  const cands=[];let firstAt=-1;
  const enough=function(){
    return cands.length>=TAIL.pool||(firstAt>=0&&tries-firstAt>=TAIL.extraTries);};
  for(let p=0;p<tail.length;p++){
    for(let qi=tail.length;qi>p;qi--){
      if(++tries>200||Date.now()>deadline||enough())break;
      const nt=tail.slice(); const c=nt.splice(p,1)[0]; nt.splice(qi-1,0,c);
      const nd=head.concat(nt);
      if(allHit(mk[0],mk[1],wr,nd,di,LV.tgt.win,tv,LV.rank)){
        cands.push(nd);if(firstAt<0)firstAt=tries;}
    }
    if(Date.now()>deadline||enough())break;
  }
  // Anything that lands still ships. One candidate means today's answer exactly.
  if(cands.length)return pickBestTail(cands);
  while(Date.now()<deadline&&tries<600){
    tries++;

    for(let x=nt.length-1;x>0;x--){const y=Math.floor(rnd()*(x+1));const t=nt[x];nt[x]=nt[y];nt[y]=t;}
    const nd=head.concat(nt);
    if(allHit(mk[0],mk[1],wr,nd,di,LV.tgt.win,tv,LV.rank))return nd;
  }
  return null;
}
// The ladder. Each rung gives up a little more, and only the unseen state ever moves.
function countWilds(d){let n=0;for(let p=0;p<d.length;p++)if(isWildCard(d[p]))n++;return n;}
// re-insert any committed wild a rung dropped. Position may change, existence may not.
function preserveWilds(want){
  let have=countWilds(dk);
  while(have<want){
    const at=di+Math.floor(rnd()*(dk.length-di+1));
    dk.splice(at,0,['WILD','',false,false,true]);
    have++;
  }
  LV.deck=dk.slice();
  return have;
}
function verifiedAbsorb(delta){
  const rt=retarget(delta);
  const mk=maskOf();

  // KEEP - already lands on the retargeted number
  if(allHit(mk[0],mk[1],wr,dk,di,LV.tgt.win,rt.tv,LV.rank)){
    LV.tv=rt.tv;return {status:'keep',tv:rt.tv,moved:rt.moved};}
  // ADJUST - re-order what is still to be drawn
  const d2=proveFrom(rt.tv,350);
  if(d2){dk=d2;LV.deck=d2.slice();LV.tv=rt.tv;replans++;
    preserveWilds(wilds);
    return {status:'adjust',tv:rt.tv,moved:rt.moved};}
  // REPLAN - re-deal everything the player has not seen
  const deep=Date.now()+500;
  while(Date.now()<deep){
    const c=reassignUnseen(rnd);
    if(!c)break;
    if(allHit(mk[0],mk[1],wr,c.deck,di,LV.tgt.win,rt.tv,c.rank)){
      LV.rank=c.rank;LV.LB=c.LB;dk=c.deck;LV.deck=c.deck.slice();LV.tv=rt.tv;replans++;
      preserveWilds(wilds);   // a re-deal must not eat a committed wild
      return {status:'replan',tv:rt.tv,moved:rt.moved};}

  // Close Win that cannot hold 2 tries 1 and 3 before anything further out.
  for(const v of bandOrder()){
    if(v===rt.tv)continue;
    const d3=proveFrom(v,120);

}
// One entry point for every gameplay-card injection, whatever produced it. The active
// director decides what to do; the caller never reaches inside a director.
function onGameplaySupplyChanged(evt){
  if(!LV)return null;
  let res;
  if(ecInRescue()&&EC){
    EC.rem+=evt.amount;                 // an earned extension of the SAME rescue:
    ECLOG=null;                         // mode, story, run and intent all survive
    EC.earned=(EC.earned||0)+evt.amount;
    res={status:'ec',tv:LV.tv,moved:0};
  }else if(LV.live||LV.liveDeck){
    LV.deckLen=(LV.deckLen||0)+evt.amount;
    RUNLEFT=0;                          // stale steering budget, recompute on next draw
    res={status:'live',tv:LV.tv,moved:0};
  }else{
    res=verifiedAbsorb(evt.amount);
  }
  const rec=Object.assign({},evt,{status:res.status,tv:res.tv,tvMoved:res.moved,
    director:ecInRescue()?'ECED':((LV.live||LV.liveDeck)?'LIVE':'VERIFIED'),
    at:log.length});
  SUPPLY_LOG.push(rec);if(SUPPLY_LOG.length>40)SUPPLY_LOG.shift();
  health=res.status==='keep'?'Target intact.':
         res.status==='live'?'Steering live from here.':
         ('Target held \u2014 '+res.status+'.');
  return rec;
}
// ---- the mutation itself -----------------------------------------------------
// Only the unseen region is ever touched. Everything at or before di has been drawn and
// is the player's committed reality.
function addExtraCards(n,source){
  if(!LV||n<=0)return null;
  if(N-cl.size===0)return null;                 // level already won: nothing to extend
  const before=deckLeft();
  const added=[];
  if(LV.live||LV.liveDeck){
    LV.deckLen=(LV.deckLen||0);                 // live mints on demand; only the count moves
  }else{
    for(let g=0;g<n;g++){
      const r=supplyPick();
      if(r===undefined)break;
      const L2=supplyLabel(r);
      const at=di+Math.floor(rnd()*(dk.length-di+1));   // unseen region only
      dk.splice(at,0,[L2[0]+L2[1],r,L2[2],true]);   // [3]: granted, not core supply
      added.push({rank:r,at:at});
    }
    LV.deck=dk.slice();
  }
  const amount=added.length||n;
  const evt={rewardType:'ExtraCards',amount:amount,source:source||'Other',
    deckBefore:before,deckAfter:before+amount,
    insertionIndex:added.length?added[0].at:-1,specialCardType:'None',
    cards:added.map(function(a){return RN[a.rank];})};
  return onGameplaySupplyChanged(evt);
}

// A wild earned from a streak is a real card at a real position in the unseen deck, not
// a free use of the button. §34: the position is part of the state, so the director is
// told where it landed and must never quietly replace it.
function insertWild(count,source){
  if(!LV||N-cl.size===0)return null;
  const before=deckLeft();
  let at=-1;
  if(LV.live||LV.liveDeck){
    // live mints on demand, so there is no array to splice. Schedule it instead: the
    // nth future draw comes back a wild. Same behaviour, same reported index.
    const span=Math.max(1,(LV.deckLen||di+1)-di);
    at=di+Math.floor(rnd()*span);
    LV.wildAt=LV.wildAt||[];LV.wildAt.push(at);
    LV.deckLen=(LV.deckLen||0)+1;
  }else{
    at=di+Math.floor(rnd()*(dk.length-di+1));
    dk.splice(at,0,['WILD','',false,false,true]);   // [4] marks a committed wild
    LV.deck=dk.slice();
  }
  const evt={rewardType:'WildCard',amount:count||1,source:source||'Other',
    deckBefore:before,deckAfter:before+1,insertionIndex:at,
    specialCardType:'Wild',cards:['WILD']};
  const rec=onGameplaySupplyChanged(evt);
  if(rec)rec.insertionIndex=at;

}
function isWildCard(c){return !!(c&&c[4]);}
// a rank that does not oversubscribe the physical deck, preferring one the board can use
function supplyPick(){
  const cap=4*Math.ceil((N+DECKN+16)/52);
  const used={};
  if(LV.seed!==undefined)used[LV.seed]=1;
  for(let p=0;p<dk.length;p++)used[dk[p][1]]=(used[dk[p][1]]||0)+1;
  for(let i=0;i<N;i++)if(LV.rank[i]!==undefined)used[LV.rank[i]]=(used[LV.rank[i]]||0)+1;
  const free=ALL.filter(function(r){return (used[r]||0)<cap;});
  if(!free.length)return undefined;
  return free[Math.floor(rnd()*free.length)];
}
function supplyLabel(r){
  if(LV.usd&&typeof dLabel==='function')return dLabel(r);
  return mixLabel(r,0);

// ==== STREAK REWARDS ===========================================================
// The 5-card streak already existed and already paid a counter. This makes the payout
// mean something: coins, extra cards, or a wild - doubled when the whole streak was one
// colour. Colour is RED/BLACK, not suit, and a wild play is colour-neutral: it keeps the
// streak alive without ever establishing or breaking the colour.

const STREAK_REWARD={
  type:'ExtraCards',          // 'Coins' | 'ExtraCards' | 'WildCard' - see the panel
  amount:1,
  sameColorMultiplier:2,      // scalable rewards only
  wildScales:false,           // one wild stays one wild even on a same-colour streak
  maxExtraCardsPerLevel:6,    // §14 loop guard
  maxRewardsPerLevel:4,
  fallbackType:'Coins',       // what to pay once a cap is reached
  fallbackAmount:100
};
let STK={n:0,color:null,same:true,cards:[]};   // colour state across the current streak
let STREAK_LOG=[];                              // telemetry, one row per completion
let STK_LAST=null;                              // last completion, for the play log
let STREAK_GRANTED=0, STREAK_REWARDS=0, COINS=0;

function stkReset(){STK={n:0,color:null,same:true,cards:[]};}
// called from play(), after the card is on the waste
// isWild  : this streak slot IS a wild - colour-neutral, drawn yellow
// viaWild : an ordinary card a wild helped play - its own colour counts as normal
function stkNote(label,isRed,isWild,viaWild){
  STK.n++;
  STK.cards.push({label:label,red:!!isRed,wild:!!isWild,via:!!viaWild});
  if(isWild)return;                        // a wild neither sets nor breaks the colour
  const c=isRed?'RED':'BLACK';
  if(STK.color===null)STK.color=c;         // the first real card fixes it
  else if(STK.color!==c)STK.same=false;    // a mismatch kills the bonus for good
}
// what a completion would pay right now, so the meter can show it before it happens
function stkPending(){
  const R=STREAK_REWARD, colorMult=stkMultiplier();
  const scales=!(R.type==='WildCard'&&!R.wildScales);
  let amt=scales?R.amount*colorMult:R.amount;
  // the per-level cap can clamp an extra-card reward below its doubled value, which is
  // another way the advertised bonus can fail to arrive
  if(R.type==='ExtraCards')amt=Math.min(amt,Math.max(0,R.maxExtraCardsPerLevel-STREAK_GRANTED));
  const eff=R.amount>0?(amt/R.amount):1;
  return {amount:amt,base:R.amount,mult:eff,colorMult:colorMult,scales:scales,
    applied:eff>1,                      // did the same-colour streak actually pay more?
    label:R.type==='Coins'?(amt+' coins'):
          R.type==='ExtraCards'?('+'+amt+' card'+(amt===1?'':'s')):
          ('+'+amt+' wild')};
}
function stkMultiplier(){
  return (STK.same&&STK.color!==null)?STREAK_REWARD.sameColorMultiplier:1;
}
// the 5th card landed. Decide the reward, grant it, and let the director absorb it.
function streakComplete(){
  if(!LV){stkReset();return null;}      // no level, nothing to reward against
  const R=STREAK_REWARD;
  const mult=stkMultiplier();
  const sameColor=(mult>1);
  const won=(N-cl.size===0);
  let type=R.type, base=R.amount, amount;

  // §14 caps. Once reached, pay the configured fallback rather than nothing.
  const capHit=(STREAK_REWARDS>=R.maxRewardsPerLevel)||
    (type==='ExtraCards'&&STREAK_GRANTED>=R.maxExtraCardsPerLevel);
  if(capHit&&type!=='Coins'){type=R.fallbackType;base=R.fallbackAmount;}

  if(type==='WildCard'){
    amount=R.wildScales?base*mult:base;     // a wild is deliberately not doubled
  }else{
    amount=base*mult;
  }
  if(type==='ExtraCards'){
    const room=Math.max(0,R.maxExtraCardsPerLevel-STREAK_GRANTED);
    amount=Math.min(amount,room);
    if(amount<=0){type=R.fallbackType;amount=R.fallbackAmount;}
  }

  const rec={cards:STK.cards.map(function(c){return c.label;}),
    color:STK.color,sameColor:sameColor,
    rewardType:type,baseReward:base,multiplier:mult,finalReward:amount,
    // sameColor says the streak was one colour; bonusApplied says it changed the payout.
    // They differ for a Wild, and for any reward the level cap clamped.
    effMultiplier:base>0?(amount/base):1, bonusApplied:base>0&&amount>base,
    deckBefore:deckLeft(),deckAfter:deckLeft(),director:'-',status:'-',
    levelWin:won,capped:capHit};

  // §15 - a level that just ended does not get cards appended to a dead deck
  if(won){
    rec.status='endLevel';

    if(type==='Coins')COINS+=amount;
  }else if(type==='Coins'){

  }else if(type==='ExtraCards'){
    STREAK_GRANTED+=amount;
    const r=addExtraCards(amount,'StreakReward');
    if(r){rec.status=r.status;rec.director=r.director;rec.deckAfter=r.deckAfter;
          rec.tvMoved=r.tvMoved;}
  }else if(type==='WildCard'){
    const r=insertWild(amount,'StreakReward');
    if(r){rec.status=r.status;rec.director=r.director;rec.deckAfter=r.deckAfter;

  }
  STREAK_REWARDS++;
  STREAK_LOG.push(rec);if(STREAK_LOG.length>60)STREAK_LOG.shift();
  STK_LAST=rec;
  stkReset();
  if(!SILENT)rewardPing(rec);
  return rec;
}

const REDIRECT_NOTE={

  reshaped:'Off the planned line, so the director re-dealt everything you have not seen '+

// ==== EXTRA CARD EXPERIENCE DIRECTOR =========================================
// A separate live director. It starts only when the core level has already ended,
// and from that moment it owns every unseen card. It does not answer to the core
// target - its job is to shape a short rescue into something worth paying for.
//
// The one rule that makes the odds mean anything: intent is a CONSTRAINT, not a
// weight. A rescue told to fall short is gated on ecLine(), the greatest number of
// cards a rank can strip under ANY play order. Scoring alone leaked - the forecast
// was greedy, the player is not, and a card meant to clear 2 cleared 4 on a fork.

const EC_TUNE={
  // the ladder: how likely each successive rescue on the same board is meant to land
  base:0.22, inc:0.22, cap:0.92, floor:0.12,
  adAdj:-0.04,                   // +3 is a shorter shot than +5
  intensity:0, ruthless:0,       // 0 = as built, 1 = tightest. See ecApplyIntensity.

  deadPull:0, floorFirst:1, paceSlack:1, minAllow:1, frustCap:1, endCap:1,

  // there, "did not win" and "empty" are the same event and the odds already govern it.
  emptyRate:{edge:0.10, close:0.12, far:0.20, remote:0.25},
  adBand:+10, adPace:+1,         // +3: wider band, looser pacing - fast and volatile
  coinBand:-4, coinPace:0,       // +5: tighter band, steadier - room to build
  ladderResets:'board',          // 'board' | 'session' | 'never'
  band:18,                       // controlled imperfection: pick within N of the top

// ONE DIAL. 0 leaves every derived number exactly where it is today; 1 is as hard as
// this director is willing to be. Everything below is a straight interpolation between
// those two ends, so any value in between is a real point on the curve rather than a
// preset. Move this and the rest of EC_TUNE is rewritten under it.
//
// What it does NOT touch: the section 27 floor. Even at 1 the first rescue card has to
// open something, because a rescue where nothing happens does not sell the next one -
// it teaches the player the button is a lie. Ruthless here means falling short, which
// is a thing worth paying again to fix. If you want that floor gone too, it is the
// `EC.used===0` filter in ecChoose().
const EC_ENDS={
  //             at 0     at 1
  base:        [0.55,   0.02],   // first rescue on a board
  inc:         [0.25,   0.03],   // how fast persistence pays
  cap:         [0.95,   0.25],   // ceiling however many are bought
  floor:       [0.30,   0.01],
  // Most losses strand one to three cards, so that band is where the player wants the win
  // most - and therefore where the squeeze is worth most. At 0 it is mercy; at 1 it is the
  // opposite, and being nearly finished makes the rescue harder rather than easier.
  holdAlmost:  [1,      6],      // cards left standing when it falls short
  holdProgress:[2,      8],
  minAllow:    [1,      1],      // clearing room guaranteed whenever 2+ cards stand
  almostBias:  [0.45,   0.05],   // rest goes to 'progress', which holds back more
  band:        [18,     34],     // wider band = less optimal picks, more variance
  deadEnd:     [-30,    0],      // penalty for a card that matches nothing
  deadPull:    [0,      30],     // and an appetite for one. this is the dead-card rate.
  paceSlack:   [1,      0],      // 0 spends the allowance one card at a time
  frustCap:    [1,      3],      // empty rescues in a row before the next one must land
  floorFirst:  [1,      0]       // how often the section 27 opening floor is honoured

// Named for what it should be tuning. Difficulty is one of the things it moves, but
// pacing, variance and comeback shape move with it too - a rescue at high intensity is
// meant to be a tighter, sharper experience, not merely a less winnable one.
function ecApplyIntensity(r){
  r=Math.max(0,Math.min(1,+r||0));
  EC_TUNE.intensity=r;EC_TUNE.ruthless=r;
  for(const k in EC_ENDS){const e=EC_ENDS[k];
    const v=e[0]+(e[1]-e[0])*r;
    if(k==='deadEnd')EC_TUNE.w.deadEnd=Math.round(v);
    else if(k==='deadPull')EC_TUNE.deadPull=Math.round(v);
    else if(k==='paceSlack')EC_TUNE.paceSlack=Math.round(v);
    else if(k==='minAllow')EC_TUNE.minAllow=Math.round(v);
    else if(k==='frustCap')EC_TUNE.frustCap=Math.max(1,Math.round(v));
    else if(k==='endCap')EC_TUNE.endCap=Math.max(1,Math.round(v));
    else if(k==='emptyEdge')EC_TUNE.emptyRate.edge=v;
    else if(k==='emptyClose')EC_TUNE.emptyRate.close=v;
    else if(k==='emptyFar')EC_TUNE.emptyRate.far=v;
    else if(k==='emptyRemote')EC_TUNE.emptyRate.remote=v;
    else if(k==='holdAlmost'||k==='holdProgress'||k==='band')EC_TUNE[k]=Math.round(v);

// ---- board reading -----------------------------------------------------------

const EC_SEARCH_CAP=40000;
function ecLineFull(rank){
  const memo=new Map(),base=maskOf();let cap=0,timedOut=false;
  const bestNext=new Map();
  function walk(mlo,mhi,w){
    if(++cap>EC_SEARCH_CAP){timedOut=true;return 0;}
    const key=mhi+':'+mlo+':'+w;
    const hit=memo.get(key);if(hit!==undefined)return hit;
    let best=0,pick=-1;
    const S=SCROLL?scrollOf(function(z){return !!(z<26?((mlo>>>z)&1):((mhi>>>(z-26))&1));}):0;
    for(let i=0;i<N;i++){
      if(i<26?((mlo>>>i)&1):((mhi>>>(i-26))&1))continue;
      if(LV.rank[i]===undefined)continue;
      if(!(DEP[i]||[]).every(function(p){return !!(p<26?((mlo>>>p)&1):((mhi>>>(p-26))&1));}))continue;
      if(!inView(i,S))continue;
      if(!cyc(LV.rank[i],w))continue;
      const nlo=i<26?(mlo|(1<<i)):mlo,nhi=i<26?mhi:(mhi|(1<<(i-26)));
      const r=1+walk(nlo,nhi,LV.rank[i]);
      if(r>best){best=r;pick=i;}}
    memo.set(key,best);bestNext.set(key,pick);return best;}
  const chain=walk(base[0],base[1],rank);
  // replay the winning line so callers can know which cards it takes, not just how many
  const path=[];
  let mlo=base[0],mhi=base[1],w=rank;
  for(let g=0;g<chain;g++){
    const i=bestNext.get(mhi+':'+mlo+':'+w);
    if(i===undefined||i<0)break;
    path.push(i);
    if(i<26)mlo|=(1<<i);else mhi|=(1<<(i-26));
    w=LV.rank[i];}

}
function ecLine(rank){return ecLineFull(rank).chain;}
function ecSim(rank){
  const board=N-cl.size;let imm=0,opened=0;
  for(let i=0;i<N;i++){
    if(cl.has(i)||LV.rank[i]===undefined)continue;
    if(!expo(i)||!onScreen(i))continue;
    if(!cyc(LV.rank[i],rank))continue;
    imm++;opened+=unl(i);}
  const chain=ecLine(rank);
  return {imm:imm,opened:opened,chain:chain,left:board-chain,
          finishes:chain>=board&&board>0,board:board};
}
// rank supply, widened by whatever has been granted so far
function ecSupply(r){
  const core=4*Math.ceil((N+DECKN)/52);
  let used=(LV.seed===r)?1:0;
  for(let p=0;p<dk.length;p++)if(dk[p][1]===r&&!dk[p][3])used++;   // [3] tags a rescue card
  for(let i=0;i<N;i++)if(LV.rank[i]===r&&!(ECSUP.tab&&ECSUP.tab[i]))used++;
  const coreLeft=Math.max(0,core-used);
  const rescueCap=4*Math.ceil(Math.max(1,ECGRANTED+((ECSUP.n||0)))/13);
  const rescueLeft=Math.max(0,rescueCap-((ECSUP.r&&ECSUP.r[r])||0));
  return coreLeft+rescueLeft;
}
function ecTakeSupply(r,tabIdx){
  ECSUP.r=ECSUP.r||{};ECSUP.tab=ECSUP.tab||{};
  ECSUP.n=(ECSUP.n||0)+1;              // every take, minted or revealed
  ECSUP.r[r]=(ECSUP.r[r]||0)+1;
  if(tabIdx!==undefined)ECSUP.tab[tabIdx]=1;
}
function ecFree(){return ALL.filter(function(r){return ecSupply(r)>0;});}
function ecCanDoAnything(){
  const f=ecFree();
  for(let i=0;i<f.length;i++)if(ecLine(f[i])>0)return true;
  return false;
}
// suit allocation that cannot hand out a card that already exists
function ecLabel(r){
  const copies=Math.max(1,Math.ceil((4*Math.ceil((N+DECKN)/52)+Math.ceil(ECGRANTED/13))/4));
  const ord=mixOrder(r,EC.pairUsed);
  for(const s of ord){const k=r+s;
    if((EC.pairUsed[k]||0)<copies){EC.pairUsed[k]=(EC.pairUsed[k]||0)+1;
      return [RN[r],s,s==='\u2665'||s==='\u2666'];}}
  // Budget exhausted on every suit. Hand back the one the mix wanted rather than a hard
  // spade, which was both off-dial and always black.
  const s=ord[0];return [RN[r],s,s==='\u2665'||s==='\u2666'];

// Optimistically: could n cards clear this board at all? Takes the biggest line
// available at each step, which is exactly what a win-intent rescue tries to do. Used to
// separate "we chose not to let them win" from "no card could have".
function ecFeasibleWin(n){
  const save=new Set(cl);
  let ok=false;
  for(let step=0;step<n;step++){
    if(N-cl.size===0){ok=true;break;}
    let best=null,bn=0;
    for(const r of ecFree()){
      const p=ecLineFull(r);
      if(!p.complete)continue;              // unproven line is not evidence of a win
      if(p.chain>bn){bn=p.chain;best=p;}}
    if(!best||!bn)break;
    best.path.forEach(function(i){cl.add(i);});}
  if(N-cl.size===0)ok=true;
  cl=save;
  return ok;
}
// ---- the ladder --------------------------------------------------------------
// the number the design is aiming at, before the board gets a say
function ecTargetChance(source){
  const T=EC_TUNE;
  // The terminal state gets its own, tighter guard. Every rescue sold at one card is a
  // coin flip with no middle, so the lever is not making it winnable - it is selling
  // fewer of them before the state resolves.
  const cap=((N-cl.size)<=1)?Math.min(T.frustCap,T.endCap||T.frustCap):T.frustCap;
  if(ECFRUST>=cap)return 0.98;          // paid this often for nothing: this one lands
  let p=T.base+T.inc*ECRUNS;
  return Math.max(T.floor,Math.min(T.cap,p));
}
// the number that will actually happen, which is what gets displayed
function ecWinChance(source,n){
  const t=ecTargetChance(source);
  return ecFeasibleWin(n||5)?t:0;
}
function ecBucket(){const l=N-cl.size;
  return l<=2?'edge':(l<=5?'close':(l<=9?'far':'remote'));}
// Is this rescue deliberately a dry one? Rolled once, at the start, so the whole rescue
// has a shape rather than discovering emptiness card by card. Section 9 of the brief is
// explicit that the answer must sometimes be yes - a director that always helps reads as
// one that is quietly solving the level.
function ecPickDry(intent){
  if(intent==='win')return false;
  const left=N-cl.size;
  if(left<=1)return false;                     // binary state: the odds decide, not this
  if(ECFRUST>=EC_TUNE.frustCap)return false;   // the streak guard outranks the budget
  const r=(EC_TUNE.emptyRate||{})[ecBucket()];
  return rnd()<(r===undefined?0.15:r);
}
// win outright, come up just short, or simply make ground
function ecPickIntent(chance,feasible){
  if(!feasible)return (N-cl.size)<=EC_TUNE.holdProgress?'almost':'progress';
  if(ECFRUST>=EC_TUNE.frustCap)return 'win';
  if(rnd()<chance)return 'win';
  const left=N-cl.size,b=ecBucket();
  if(left-EC_TUNE.holdProgress<1)return 'almost';
  if(b==='edge')return 'almost';
  return rnd()<EC_TUNE.almostBias?'almost':'progress';
}
// the most cards this rescue card is permitted to take. This is what the gate enforces.
// hold = cards that must still be standing when the rescue ends. It must be able to
// reach zero, or a rescue walks the board down to one card and then takes it.
function ecHold(){
  if(EC.intent==='win')return 0;
  const left=N-cl.size;
  if(EC.dry)return left;                    // chosen to be empty: hold everything
  let want=EC.intent==='almost'?EC_TUNE.holdAlmost:EC_TUNE.holdProgress;
  if(EC.frust>=2)want=Math.max(1,want-1);   // frustration eases the hold, never the gate
  if(left<=1)return Math.min(want,left);    // one card: win or nothing, no third option
  // THE GUARANTEE. A rescue that was not chosen to be dry must be able to clear at least
  // one card, or emptiness stops being a decision and goes back to being arithmetic -
  // which is what produced 5 blanks in a row and 10 empty rescues running. Floored at 1
  // regardless of tuning, because it is an invariant rather than a preference.
  const room=Math.max(1,EC_TUNE.minAllow);
  return Math.max(1,Math.min(want,left-room));
}
function ecCeiling(){
  const left=N-cl.size;
  const total=Math.max(0,left-ecHold());     // what the whole rescue may still take
  if(EC.rem<=1)return total;                 // last card: whatever is left to give
  const share=Math.ceil(total/EC.rem);       // pace it, so the stall lands late
  const slack=EC_TUNE.paceSlack+
    (EC.source==='ad'?EC_TUNE.adPace:EC_TUNE.coinPace)+(EC.frust>=2?1:0);
  return Math.max(0,Math.min(total,share+slack));
}
function ecPrintOf(mode,n){
  const src=(n<=3)?EC_CURVE3:EC_CURVE;
  return (src[mode]||src.bal).map(function(c){return c[0];}).join('');
}
function ecPickMode(n){
  const b=ecBucket();
  const wgt={};EC_MODES.forEach(function(m){wgt[m.id]=10;});
  EC_MODES.forEach(function(m){
    if(ECPRINTS.indexOf(ecPrintOf(m.id,n))>=0)wgt[m.id]=Math.max(1,wgt[m.id]-16);});
  if(b==='edge'){wgt.clutch+=26;wgt.hope+=12;wgt.tension+=8;wgt.chain-=6;}
  else if(b==='close'){wgt.clutch+=14;wgt.near+=12;wgt.tension+=12;wgt.almost+=8;}
  else if(b==='far'){wgt.almost+=20;wgt.chain+=14;wgt.near+=10;wgt.clutch-=6;}
  else {wgt.chain+=22;wgt.bal+=12;wgt.clutch-=8;wgt.near-=6;}
  if(n<=3){wgt.tension-=8;wgt.chain-=6;wgt.hope+=8;wgt.clutch+=8;}
  ECHIST.slice(-3).forEach(function(m){wgt[m]=Math.max(1,(wgt[m]||10)-12);});
  let tot=0;EC_MODES.forEach(function(m){tot+=Math.max(1,wgt[m.id]);});
  let x=rnd()*tot;
  for(const m of EC_MODES){x-=Math.max(1,wgt[m.id]);if(x<=0)return m.id;}
  return 'bal';

// ---- scoring -----------------------------------------------------------------
function ecCurveAdj(curve,s){
  switch(curve){
    case 'HOPE':        return s.chain>=1?20:-18;
    case 'SETUP':       return (s.chain>=1&&s.chain<=2)?18:(s.opened>0?10:-6);
    case 'BLOCK':       return s.chain===0?34:(s.chain<=1?4:-24);
    case 'TENSION':     return s.chain===0?14:(s.chain<=2?18:(s.finishes?-20:0));
    case 'RECOVERY':    return s.chain>=2?20:(s.chain>=1?10:-14);
    case 'CHAIN':       return s.chain>=3?24:(s.chain>=2?12:-10);
    case 'OPPORTUNITY': return s.chain>=2?22:(s.chain>=1?8:-16);
    case 'PROGRESS':    return s.chain>=2?18:(s.chain>=1?8:-12);
    case 'CLUTCH':      return (EC.intent==='win')?(s.finishes?40:(s.chain>=2?14:-10))
                                                 :(s.chain>=2?22:6);
  }
  return 0;
}
function ecScore(rank,curve){
  const W=EC_TUNE.w,s=ecSim(rank),p={};
  p.playable = s.imm>0?W.playable*Math.min(3,s.imm):0;
  p.chain    = W.chain*Math.min(5,s.chain);
  p.unblock  = W.unblock*Math.min(4,s.opened);
  p.progress = s.board>0?Math.round(W.progress*(s.chain/s.board)):0;
  if(EC.intent==='win'){p.finish=s.finishes?W.finish:0;p.nearly=0;}
  else{
    p.finish=s.finishes?-70:0;
    const lo=EC.intent==='almost'?1:2,hi=EC.intent==='almost'?2:4;
    p.nearly=(s.left>=lo&&s.left<=hi)?W.nearly:0;}
  p.recovery = (EC.rem>1&&s.left>0&&s.chain>0)?W.recovery:0;
  p.mode     = ecCurveAdj(curve,s);
  p.deadEnd  = (s.chain===0&&curve!=='BLOCK')?W.deadEnd:0;
  p.dead     = (s.chain===0)?EC_TUNE.deadPull:0;
  p.repeat   = EC.recent.indexOf(rank)>=0?W.repeat:0;
  let total=0;for(const k in p)total+=p[k];
  return {parts:p,total:total,sim:s};
}
function ecQualityOf(rank,s){
  if(s.finishes)return 'Finish';
  if(s.chain>=4)return 'Clutch';
  if(s.chain>=3)return 'Strong';
  if(s.chain>=2)return 'Useful';
  if(s.chain>=1)return 'Setup';
  return s.opened>0?'Weak':'Dead';
}
// ---- choosing the card -------------------------------------------------------
function ecChoose(){
  const src=(EC.cards<=3)?EC_CURVE3:EC_CURVE;
  const arc=src[EC.mode]||src.bal;
  const curve=arc[Math.min(EC.used,arc.length-1)];
  const ceil=ecCeiling(),last=EC.rem<=1,alive=(N-cl.size)>0;
  const all=[];
  for(const r of ecFree()){
    const sc=ecScore(r,curve);
    all.push({r:r,sc:sc,q:ecQualityOf(r,sc.sim),gated:false});}
  if(!all.length)return null;

  // HARD GATE. Intent outranks the arc and the score both. A rescue told to fall
  // short cannot be handed a rank the player could win with, whatever it scores.
  let cands=all;
  if(EC.intent!=='win'){
    const keep=all.filter(function(c){return c.sc.sim.chain<=ceil;});
    all.forEach(function(c){if(c.sc.sim.chain>ceil)c.gated=true;});
    if(keep.length)cands=keep;
    else{const nf=all.filter(function(c){return !c.sc.sim.finishes;});
         if(nf.length){   // nothing is inert: give away as little as possible
           let mn=1e9;nf.forEach(function(c){if(c.sc.sim.chain<mn)mn=c.sc.sim.chain;});
           cands=nf.filter(function(c){return c.sc.sim.chain===mn;});}
         else cands=all;}
  }else if(last&&alive){
    // last card of a rescue meant to land: take the win if one exists
    const fin=cands.filter(function(c){return c.sc.sim.finishes;});
    if(fin.length)cands=fin;
  }
  // safety: never two dead in a row, never a wasted final card
  const lastDead=EC.story.length&&EC.story[EC.story.length-1].cleared===0;
  const holding=ceil<=0;
  // A rescue that was not chosen to be dry owes the player something on every card, not
  // only after two blanks have already gone by. If the gate allows nothing that clears,
  // reach past it for the smallest chain that still cannot win.
  if(EC_RULES.active&&alive&&!EC.dry){
    const live1=cands.filter(function(c){return c.sc.sim.chain>0;});
    if(!live1.length){
      const nf=all.filter(function(c){return c.sc.sim.chain>0&&!c.sc.sim.finishes;});
      if(nf.length){let mn=1e9;
        nf.forEach(function(c){if(c.sc.sim.chain<mn)mn=c.sc.sim.chain;});
        cands=nf.filter(function(c){return c.sc.sim.chain===mn;});}}
  }
  // --- satisfaction rules, applied over whatever the dial decided ---------------
  if(EC_RULES.active&&alive){
    let run=0;
    for(let z=EC.story.length-1;z>=0;z--){
      if(EC.story[z].mistake)continue;          // their misplay, their cost
      if(EC.story[z].cleared===0)run++;else break;}
    const live0=EC.story.filter(function(s){return !s.mistake&&s.cleared>0;}).length;
    const lastChance=(EC.rem<=1&&live0===0&&EC_RULES.minLive>0);
    if(run>=EC_RULES.maxDeadRun||lastChance){
      let live=cands.filter(function(c){return c.sc.sim.chain>0;});
      if(!live.length)   // reach past the ceiling if the gate allows nothing live,
        live=all.filter(function(c){return c.sc.sim.chain>0&&!c.sc.sim.finishes;});
      if(live.length)cands=live;}   // but never as far as a win
  }
  // a rescue that is meant to land cannot afford to spend a card on nothing
  if(EC.intent==='win'&&alive){
    const prog=cands.filter(function(c){return c.sc.sim.chain>0;});
    if(prog.length)cands=prog;}
  if(EC.used===0&&alive&&rnd()<EC_TUNE.floorFirst){
    let open=cands.filter(function(c){return c.sc.sim.chain>0;});
    if(!open.length){
      // Nothing the gate allows can clear - typically a chain of two on a board whose
      // ceiling is one. Reach past the ceiling for the smallest non-winning chain. Safe
      // now only because ecHold() can never cover the whole board, so a non-finishing
      // card always leaves at least one standing.
      const nf=all.filter(function(c){return c.sc.sim.chain>0&&!c.sc.sim.finishes;});
      if(nf.length){let mn=1e9;
        nf.forEach(function(c){if(c.sc.sim.chain<mn)mn=c.sc.sim.chain;});
        open=nf.filter(function(c){return c.sc.sim.chain===mn;});}}
    if(open.length)cands=open;}
  const safe=cands.filter(function(c){
    if(holding)return true;                 // deliberately stalling: dead is the point
    if(lastDead&&c.sc.sim.chain===0)return false;
    if(last&&alive&&c.sc.sim.chain===0)return false;
    return true;});
  const live=cands.filter(function(c){return c.sc.sim.chain>0;});
  const base=safe.length?safe:(live.length?live:cands);
  base.sort(function(a,b){return b.sc.total-a.sc.total;});
  // controlled imperfection: a band, not the maximum
  const top=base[0].sc.total;
  let bandNow=Math.max(6,EC_TUNE.band+
    (EC.source==='ad'?EC_TUNE.adBand:EC_TUNE.coinBand)+(EC.frust>=2?6:0));
  if(EC.intent==='win')bandNow=Math.max(3,Math.round(bandNow*0.35));
  const pool=base.filter(function(c){return c.sc.total>=top-bandNow;})
                 .slice(0,EC_TUNE.pool);
  const pick=pool[Math.floor(rnd()*pool.length)];
  all.sort(function(a,b){return b.sc.total-a.sc.total;});
  ECLOG={curve:curve,ceil:ceil,cands:all.slice(0,7),pick:pick.r,
         pool:pool.length,gated:all.filter(function(c){return c.gated;}).length};
  return {rank:pick.r,curve:curve,sim:pick.sc.sim,q:pick.q,parts:pick.sc.parts};
}
// mint the next rescue card. called from draw() when the core deck is spent.
function ecMint(){
  if(!EC||EC.rem<=0)return null;
  const c=ecChoose();
  // only ever ends early if there is genuinely no rank left to deal, which would
  // otherwise soft-lock the board on a deck that says it still has cards
  if(!c){EC.spare=EC.rem;EC.rem=0;return null;}
  EC.rem--;EC.used++;
  EC.recent.push(c.rank);if(EC.recent.length>3)EC.recent.shift();
  EC.cardCeil=Math.min(c.sim.chain,ecCeiling());
  EC.cardCleared=0;
  EC.story.push({curve:c.curve,rank:c.rank,cleared:0,opened:0,
                 want:c.sim.chain,q:c.q});
  if(LV.pool&&LV.pool[c.rank]>0)LV.pool[c.rank]--;
  ecTakeSupply(c.rank);
  const L2=ecLabel(c.rank);
  return [L2[0]+L2[1],c.rank,L2[2],true];   // [3] marks this as a rescue card
}
// during a rescue the rescue director owns reveals too, or the chain runs past its
// ceiling and the intent leaks - this is the bug that made every rescue cascade.
function ecReveal(newly){
  if(!newly.length||!LV.pool)return;
  // The same exclusion dReveal makes, which this path was missing entirely: a wild has no
  // rank and a lock or key answers only its partner, so binding either spends a card from
  // the pool on a slot that will never read it. On the rescue path that matters twice over,
  // because the supply it draws from is the one the rescue just topped up.
  newly=newly.filter(function(z){return !isWildSlot(z)&&!isLKSlot(z);});
  if(!newly.length)return;
  newly=newly.slice().sort(function(a,b){return dChildren(b)-dChildren(a);});
  let w=wr,cont=Math.max(0,EC.cardCeil-EC.cardCleared);
  for(const n of newly){
    let r;
    if(cont>0){const c=nb(w).filter(function(x){return ecSupply(x)>0;});
      if(c.length){r=dPick(c);w=r;cont--;}}
    if(r===undefined){
      const f=ecFree(),hot={};
      hot[wr]=1;nb(wr).forEach(function(x){hot[x]=1;});
      nb(w).forEach(function(x){hot[x]=1;});
      for(let z=0;z<N;z++)if(!cl.has(z)&&LV.rank[z]!==undefined&&expo(z))
        nb(LV.rank[z]).forEach(function(x){hot[x]=1;});
      const inert=f.filter(function(x){return !hot[x];});
      if(inert.length)r=dPick(inert);
      else{   // nothing is fully inert: take whatever touches the board least
        let best=null,bn=1e9;
        for(const x of f){let n2=0;
          for(let z=0;z<N;z++)if(!cl.has(z)&&LV.rank[z]!==undefined&&expo(z)&&cyc(LV.rank[z],x))n2++;
          if(cyc(x,wr))n2++;
          if(n2<bn){bn=n2;best=x;}}
        r=best;}}
    if(r===undefined)return;
    if(LV.pool[r]>0)LV.pool[r]--;
    ecTakeSupply(r,n);
    LV.rank[n]=r;LV.LB[n]=ecLabel(r);}
}
// ---- lifecycle ---------------------------------------------------------------
function ecStart(n,source){
  if(!LV||EC&&EC.rem>0)return;
  if(PHASE==='won')return;                       // no rescue after the level is over
  // ECFRUST is incremented inside ecEmit(), which was only reachable from render() -
  // and render() early-returns while SILENT. So in every headless measurement the empty
  // streak stayed at zero and frustCap never fired: the guard has never actually run.
  // State transitions must not depend on the view layer.
  if(EC&&EC.used>0)ecEmit();
  snap();
  stack[stack.length-1].paid=true;   // undo stops here: the grant is not refundable
  const pu={};
  const bump=function(r,s){if(!s)return;const k=r+s;pu[k]=(pu[k]||0)+1;};
  bump(LV.seed,LV.seedCard[1]);
  for(let p=0;p<dk.length;p++)bump(dk[p][1],dk[p][0].slice(-1));
  for(let i=0;i<N;i++)if(LV.rank[i]!==undefined&&LV.LB[i])bump(LV.rank[i],LV.LB[i][1]);
  ECGRANTED+=n;
  const feasible=ecFeasibleWin(n);
  const target=ecTargetChance(source);
  const chance=feasible?target:0;
  PHASE='rescuePlaying';
  EC={cards:n,rem:n,used:0,source:source,mode:ecPickMode(n),
      chance:Math.round(chance*100),target:Math.round(target*100),
      feasible:feasible,intent:'win',run:ECRUNS+1,
      startLeft:N-cl.size,cleared:0,opened:0,dead:0,payouts:0,spare:0,
      story:[],recent:[],pairUsed:pu,cardCeil:0,cardCleared:0,t0:Date.now()};
  EC.intent=ecPickIntent(target,feasible);
  EC.dry=ecPickDry(EC.intent);              // decided once, before any card is minted
  EC.frust=ECFRUST;
  ECRUNS++;ECHIST.push(EC.mode);if(ECHIST.length>6)ECHIST.shift();
  ECPRINTS.push(ecPrintOf(EC.mode,n));if(ECPRINTS.length>3)ECPRINTS.shift();
  render();
}
function ecQuality(){
  if(!EC)return 0;
  let q=0;
  q+=Math.min(40,EC.cleared*9);
  q+=Math.min(16,EC.opened*4);
  q+=EC.payouts*10;
  q+=(N-cl.size===0)?26:((N-cl.size<=2&&EC.cleared>0)?14:0);
  q-=EC.dead*8;
  return Math.max(0,Math.min(100,Math.round(q)));
}
function ecOutcome(){
  if(!EC)return '';
  const left=N-cl.size;
  if(left===0)return EC.used<=1?'Immediate win':'Rescue win';
  if(left<=2)return EC.cleared>0?'Near win':'No recovery';
  if(EC.cleared>=Math.ceil(EC.startLeft/2))return 'Strong progress';
  if(EC.cleared>0)return 'Partial comeback';
  return 'No recovery';
}
function ecEmit(){
  if(!EC||EC._sent)return;EC._sent=true;
  const left=N-cl.size;
  ECFRUST=(EC.cleared===0)?ECFRUST+1:0;
  ECEVENTS.push({
    level:LV?LV.short:'', coreOutcome:LV&&LV.ti!==undefined?OUT[LV.ti].n:'',
    rescueType:EC.source==='ad'?'Ad':'Coin', cardsGranted:EC.cards,
    rescueNumber:EC.run, mode:EC.mode, intent:EC.intent,
    targetPct:EC.target, statedPct:EC.chance, feasible:EC.feasible,
    cardsUsed:EC.story.length, cardsUnspent:EC.spare,
    cardsCleared:EC.cleared, cardsOpened:EC.opened,
    deadCards:EC.story.filter(function(s){return s.cleared===0;}).length,
    maxChain:EC.story.reduce(function(a,s){return Math.max(a,s.cleared);},0),
    startCards:EC.startLeft, endCards:left, payouts:EC.payouts,
    outcome:ecOutcome(), quality:ecQuality(),
    frustBefore:EC.frust||0, intensity:EC_TUNE.intensity,
    ms:Date.now()-(EC.t0||Date.now())});
  if(ECEVENTS.length>500)ECEVENTS.shift();
}
function stkEventsCSV(){
  if(!STREAK_LOG.length)return;
  const cols=['cards','color','sameColor','bonusApplied','rewardType','baseReward',
    'multiplier','effMultiplier','finalReward','deckBefore','deckAfter','director',
    'status','tvMoved','insertionIndex','levelWin','capped'];
  const q=function(v){return '"'+String(v===undefined?'':v).replace(/"/g,'""')+'"';};
  const lines=[cols.map(q).join(',')];

    lines.push(cols.map(function(c){
      return q(c==='cards'?r.cards.join(' '):r[c]);}).join(','));});

}
function ecEventsCSV(){
  if(!ECEVENTS.length)return;
  const cols=Object.keys(ECEVENTS[0]);
  const q=function(v){return '"'+String(v).replace(/"/g,'""')+'"';};
  const lines=[cols.map(q).join(',')];

}
function ecReset(hard){
  if(EC&&EC.used>0)ecEmit();

  if(hard||EC_TUNE.ladderResets==='board'){ECRUNS=0;ECGRANTED=0;ECFRUST=0;ECPRINTS=[];}
  if(hard){ECHIST=[];ECEVENTS=[];}
}

function ecOverlay(won,lost,left){
  const host=document.getElementById('ecov');if(!host)return;
  let h='';
  const running=EC&&(EC.rem>0||EC.used>0);
  if(running){
    const md=EC_MODES.filter(function(x){return x.id===EC.mode;})[0]||{n:EC.mode};
    const done=left===0,shortfall=EC.rem===0&&left>0;
    h+='<div class="ecbar'+(done?' done':(shortfall?' short':''))+'">'+
      '<span class="ecbl">'+md.n+'</span>'+
      '<span class="ectag">'+(EC.source==='ad'?'+3 ad':'+5 coins')+'</span>'+
      '<span class="ectag">try '+EC.run+'</span>'+
      '<span class="ectag'+(EC.intent!=='win'?' hot':'')+'">aim '+EC.intent+'</span>'+
      '<span class="ectag">odds '+EC.chance+'%</span>'+
      '<span class="ectag">Q'+ecQuality()+'</span>'+
      (EC.rem===0?'<span class="ectag">'+ecOutcome()+'</span>':'')+
      (EC.spare?'<span class="ectag">'+EC.spare+' unspent</span>':'')+
      '<span class="ecsteps">'+EC.story.map(function(p,i){
        return '<span class="ecstep'+(i===EC.story.length-1&&EC.rem>=0&&left>0?' now':'')+
          (p.cleared===0?' nil':'')+'"><b>'+p.curve.slice(0,4)+'</b>'+RN[p.rank]+
          '<i>'+p.cleared+'</i></span>';}).join('')+
        (EC.rem>0?'<span class="ecstep pend">+'+EC.rem+'</span>':'')+
      '</span></div>';
  }
  // the offer returns only when the rescue budget is spent - never while cards remain
  if(lost&&left>0&&(!EC||EC.rem===0)){
    const can=ecCanDoAnything();
    const nxt=Math.round(ecWinChance('coins')*100);
    h+='<div class="ecpad"><div class="ecoffer">'+
      '<div class="ecoh"><span class="ecot">Out of cards</span>'+
        '<span class="ecos">'+left+' left'+(ECRUNS?' \u00b7 '+ECRUNS+' rescue'+(ECRUNS===1?'':'s')+' used':'')+'</span></div>';
    if(!can)   // nothing in the deck can touch this board - say so, but still offer
      h+='<div class="ecdead">No rank left in the deck can touch this board right now, '+
        'so either rescue is a long shot.</div>';
    h+='<div class="ecolead">Take more cards and keep this board, or walk away and start it again.</div>'+
      '<div class="ecbtns">'+
      '<div class="ecbtn" onclick="ecStart(3,\'ad\')">'+
        '<div class="ecbk">Watch an ad</div><div class="ecbn">+3</div>'+
        '<div class="ecbs">a short shot</div></div>'+
      '<div class="ecbtn coin" onclick="ecStart(5,\'coins\')">'+
        '<div class="ecbk">Spend coins</div><div class="ecbn">+5</div>'+
        '<div class="ecbs">room to build</div></div>'+
      '</div><div class="ecquit"><button onclick="reset()">Quit and replay</button>'+
      '<span class="ecfine">Each rescue on this board is a better shot than the last \u2014 next is about '+nxt+'%.</span></div>';
    h+='</div></div>';
  }
  host.innerHTML=h;
}

function rewardPing(rec){
  if(!rec)return;
  const wrap=document.getElementById('boardwrap');
  if(wrap){
    const big=rec.rewardType==='Coins'?(rec.finalReward+' COINS'):
      rec.rewardType==='ExtraCards'?('+'+rec.finalReward+' EXTRA CARD'+(rec.finalReward===1?'':'S')):
      ('+'+rec.finalReward+' WILD');
    const sub=(rec.bonusApplied?('ALL '+rec.color+' \u00b7 \u00d7'+rec.effMultiplier+' BONUS'):
              (rec.sameColor?('ALL '+rec.color):'STREAK COMPLETE'))+
      (rec.capped?' \u00b7 LEVEL CAP REACHED':'')+
      (rec.status==='endLevel'?' \u00b7 PAID AT LEVEL END':'');
    const el=document.createElement('div');
    el.className='rewardfly';
    el.innerHTML=big+'<small>'+sub+'</small>';
    wrap.appendChild(el);
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},1700);
  }
  if((rec.rewardType==='ExtraCards'||rec.rewardType==='WildCard')&&rec.status!=='endLevel'){
    const tile=document.getElementById('deckcnt')||document.getElementById('deck');
    if(tile){tile.classList.remove('pinged');void tile.offsetWidth;tile.classList.add('pinged');}
  }
}
